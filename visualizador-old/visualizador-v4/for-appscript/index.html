<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archivo de prácticas — Visualizador</title>

  <base target="_top">

  <style>
  /* =========================================================
     1. Base
     Escala de grises sobre #f5f5f5, igual que el formulario.
     ========================================================= */
  :root {
    --fondo: #f5f5f5;
    --papel: #fdfdfd;
    --hueco: #e4e4e4;
    --tinta: #1a1a1a;
    --tinta-media: #555555;
    --tinta-suave: #8a8a8a;
    --borde: #1a1a1a;
    --borde-tenue: #c9c9c9;
    --radio: 3px;

    --paso: 0.45s;
    --curva: cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    /* El tablero ocupa la pantalla: no hay scroll de página, cada
       sección se desplaza por dentro. */
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--fondo);
    color: var(--tinta);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  button {
    font-family: inherit;
    color: inherit;
    background: transparent;
    border: none;
    cursor: pointer;
  }

  :focus-visible {
    outline: 2px solid var(--tinta);
    outline-offset: 2px;
  }

  [hidden] { display: none !important; }

  /* =========================================================
     2. Barra superior
     ========================================================= */
  .barra {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.75rem 1.5rem;
    padding: 1.25rem 1.75rem;
    border-bottom: 1px solid var(--borde);
  }

  .barra h1 {
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .estudiante {
    font-size: 0.875rem;
    color: var(--tinta-media);
  }

  .acciones {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 0.625rem;
  }

  /* Aviso discreto de que la clasificación se está guardando. */
  .guardado {
    font-size: 0.6875rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--tinta-suave);
    min-width: 5.5rem;
    text-align: right;
  }

  .guardado.falla { color: var(--tinta); font-weight: 600; }

  .boton {
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    padding: 0.5rem 0.875rem;
    border: 1px solid var(--borde-tenue);
    border-radius: var(--radio);
    text-decoration: none;
    color: var(--tinta);
    white-space: nowrap;
  }

  .boton:hover { background: #ebebeb; border-color: var(--borde); }

  /* Volver a la vista general: una flecha, arriba a la izquierda. */
  .volver {
    flex: 0 0 auto;
    width: 2rem;
    height: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    line-height: 1;
    color: var(--tinta);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    align-self: center;
  }

  .volver:hover { background: var(--tinta); color: var(--papel); }

  .boton.fuerte {
    background: var(--tinta);
    border-color: var(--tinta);
    color: var(--papel);
  }

  .boton.fuerte:hover { background: #000; }

  /* =========================================================
     3. Tablero 2×2
     La transición entre vistas es la grilla misma: la sección
     elegida pasa a 1fr y las otras a 0fr, así que crece en su
     lugar en vez de aparecer como una pantalla nueva.
     ========================================================= */
  .tablero {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 1px;
    background: var(--borde-tenue);
    min-height: 0;
    transition:
      grid-template-columns var(--paso) var(--curva),
      grid-template-rows var(--paso) var(--curva);
  }

  .seccion {
    display: flex;
    flex-direction: column;
    background: var(--fondo);
    /* Sin esto las secciones no se dejan encoger a 0fr. */
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    transition: opacity var(--paso) var(--curva);
  }

  /* Las que no son la elegida se apagan mientras se colapsan. */
  .seccion.apagada {
    opacity: 0;
    pointer-events: none;
  }

  .seccion-cabecera {
    flex: 0 0 auto;
    padding: 1.25rem 1.5rem 0.875rem;
  }

  .titulo-seccion {
    display: block;
    width: 100%;
    text-align: left;
    padding: 0;
    font-size: 0.9375rem;
    font-weight: 600;
    letter-spacing: -0.005em;
  }

  .titulo-seccion:hover { text-decoration: underline; text-underline-offset: 3px; }

  .cuenta {
    font-size: 0.75rem;
    font-weight: 400;
    color: var(--tinta-suave);
    font-variant-numeric: tabular-nums;
  }

  .seccion-cuerpo {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 0 1.5rem 1.5rem;
  }

  .tablero.ampliada .seccion:not(.apagada) .seccion-cabecera { padding: 2rem 2.5rem 1.25rem; }
  .tablero.ampliada .seccion:not(.apagada) .seccion-cuerpo { padding: 0 2.5rem 2.5rem; }
  .tablero.ampliada .seccion:not(.apagada) .titulo-seccion { font-size: 1.5rem; }

  /* =========================================================
     4. Órbita
     Los nodos no van en grilla: el título queda al centro y los
     trabajos giran alrededor. El tamaño de cada uno lo decide el
     script según cuántos haya, así que pocos se ven grandes y
     muchos se reparten en más anillos sin desbordarse.
     ========================================================= */
  .cuerpo-orbita {
    position: relative;
    overflow: hidden;
    padding: 0;
  }

  .orbita { position: absolute; inset: 0; }

  .nucleo {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    max-width: 66%;
    text-align: center;
    /* El fondo despeja el centro por si un anillo queda muy cerca. */
    background: var(--fondo);
    border-radius: 50%;
    padding: 0.75rem 1rem;
  }

  .titulo-nodo {
    padding: 0;
    font-size: 0.9375rem;
    font-weight: 600;
    letter-spacing: -0.005em;
    line-height: 1.25;
  }

  .titulo-nodo:hover { text-decoration: underline; text-underline-offset: 3px; }

  .tablero.ampliada .seccion:not(.apagada) .titulo-nodo { font-size: 1.5rem; }

  /* La definición la escribe la carrera. En vista general no cabe:
     aparece solo cuando la sección está ampliada. */
  .definicion {
    display: none;
    margin: 0;
    max-width: 30rem;
    font-size: 0.9375rem;
    line-height: 1.5;
    color: var(--tinta-media);
  }

  .tablero.ampliada .seccion:not(.apagada) .definicion { display: block; }

  .resto {
    margin: 0;
    font-size: 0.6875rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--tinta-suave);
    font-variant-numeric: tabular-nums;
  }

  .vacio-nodo {
    margin: 0;
    font-size: 0.8125rem;
    color: var(--tinta-suave);
    max-width: 22rem;
  }

  /* =========================================================
     5. Trabajos
     ========================================================= */
  .grupo-linea { margin-bottom: 1.5rem; }

  .rotulo-linea {
    margin: 0 0 0.5rem;
    font-size: 0.6875rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--tinta-suave);
  }

  .obras {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(5rem, 1fr));
    gap: 0.625rem;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .tablero.ampliada .seccion:not(.apagada) .obras {
    grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr));
    gap: 1rem;
  }

  /* La ficha es el contenedor; adentro van el botón que la abre y,
     en la grilla, la casilla para seleccionarla. Antes la ficha era el
     botón, y no se puede anidar un control dentro de otro. */
  .obra {
    position: relative;
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    padding: 0;
    overflow: hidden;
    background: var(--hueco);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
    color: var(--tinta-media);
    transition: transform 0.15s var(--curva), box-shadow 0.15s var(--curva);
  }

  /* Al pasar el mouse crece y se dibuja por encima de los demás. */
  .obra:hover,
  .obra:focus-visible {
    transform: scale(1.08);
    z-index: 5;
    box-shadow: 0 3px 14px rgba(0, 0, 0, 0.18);
  }

  /* En órbita la posición la pone el script, así que el crecer al
     pasar el mouse tiene que conservar el centrado. */
  .obra.orbitando { position: absolute; transform: translate(-50%, -50%); }

  .obra.orbitando:hover,
  .obra.orbitando:focus-visible { transform: translate(-50%, -50%) scale(1.14); }

  /* Cubre la ficha entera y es lo que la abre. La miniatura va adentro;
     si no carga, queda el rectángulo gris y la ficha sigue sirviendo. */
  .obra-abrir {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    overflow: hidden;
    border: none;
    border-radius: inherit;
    background: transparent;
  }

  /* Casilla de selección, abajo a la derecha. Solo en la grilla: en las
     órbitas la ficha puede bajar a 22px y no habría dónde apuntar. */
  .elegir {
    position: absolute;
    right: 0.3rem;
    bottom: 0.3rem;
    z-index: 2;
    width: 1.125rem;
    height: 1.125rem;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    font-size: 0.75rem;
    line-height: 1;
    color: transparent;
    background: var(--papel);
    border: 1px solid var(--borde);
    border-radius: 2px;
  }

  .elegir:hover { background: #ebebeb; }

  .elegir[aria-checked="true"] {
    color: var(--papel);
    background: var(--tinta);
  }

  .obra img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Un texto no tiene imagen: se muestra el texto mismo. */
  .obra .extracto {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    padding: 0.5rem 0.6rem;
    margin: 0;
    background: var(--papel);
    font-size: 0.6875rem;
    line-height: 1.35;
    text-align: left;
    color: var(--tinta);
    overflow: hidden;
  }

  /* Se recorta la caja del texto y no el párrafo: el recorte de un
     elemento cae en el borde de su relleno, y el relleno de abajo es
     justo lo que se reserva para la casilla. Con el tope al 100%, además,
     el centrado ya no desborda por arriba y un texto largo no pierde su
     primera línea. */
  .obra .extracto span {
    max-height: 100%;
    overflow: hidden;
  }

  /* En la grilla la casilla ocupa la esquina de abajo: el texto termina
     antes de llegar a ella. */
  .obra.con-casilla .extracto { padding-bottom: 1.7rem; }

  .obra.diminuta .extracto { display: none; }

  /* Marca de reproducción para los videos. */
  .obra .marca-video {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 34%;
    aspect-ratio: 1;
    border: 1px solid var(--papel);
    border-radius: 50%;
    background: rgba(26, 26, 26, 0.45);
  }

  .obra .marca-video::after {
    content: "";
    position: absolute;
    left: 54%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-style: solid;
    border-width: 0.28em 0 0.28em 0.45em;
    border-color: transparent transparent transparent var(--papel);
    font-size: 1em;
  }

  /* Un punto por cada nodo al que fue enviado el trabajo. */
  .obra .marcas {
    position: absolute;
    left: 0.3rem;
    bottom: 0.3rem;
    display: flex;
    gap: 0.2rem;
  }

  .obra .marcas i {
    width: 0.3rem;
    height: 0.3rem;
    border-radius: 50%;
    background: var(--papel);
    box-shadow: 0 0 0 1px rgba(26, 26, 26, 0.55);
  }

  /* Con fichas muy chicas los puntos estorban más de lo que informan. */
  .obra.diminuta .marcas { display: none; }

  /* =========================================================
     6. Selección múltiple
     ========================================================= */
  /* Seleccionada: se nota en el borde, no solo en la casilla. */
  .obra.elegida {
    border-color: var(--tinta);
    box-shadow: inset 0 0 0 3px var(--tinta);
  }

  .obra.elegida img,
  .obra.elegida .extracto { opacity: 0.45; }


  .lote {
    position: fixed;
    left: 50%;
    bottom: 1.25rem;
    transform: translateX(-50%);
    /* Sin esto el ancho se calcula con la mitad de pantalla que queda a la
       derecha de left: 50%, y la barra se partía en dos líneas aunque
       sobrara espacio. El max-width de abajo sigue poniendo el tope. */
    width: max-content;
    z-index: 40;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    max-width: calc(100% - 2rem);
    padding: 0.75rem 1rem;
    background: var(--papel);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.14);
  }

  /* Enviar apagado, en la barra del lote y en el visor. */
  .boton.fuerte:disabled {
    color: var(--tinta-suave);
    background: transparent;
    border-color: var(--borde-tenue);
    cursor: not-allowed;
  }

  .lote-cuenta {
    font-size: 0.75rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    margin-right: 0.25rem;
  }

  .lote-destinos {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.4rem;
  }

  /* =========================================================
     6b. Ocultos y menú del clic derecho
     ========================================================= */
  /* Un oculto solo aparece con "Ver ocultos", y se nota que está fuera. */
  .obra.oculta { border-style: dashed; }
  .obra.oculta .obra-abrir { opacity: 0.4; }

  /* Entre la barra del lote y el visor: tapa la barra si se cruzan,
     y nunca queda encima de un trabajo abierto. */
  .menu {
    position: fixed;
    z-index: 45;
    display: flex;
    flex-direction: column;
    min-width: 13rem;
    max-width: calc(100% - 1rem);
    padding: 0.35rem;
    background: var(--papel);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.14);
  }

  .menu-titulo {
    margin: 0.3rem 0.6rem 0.1rem;
    font-size: 0.75rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .menu-rotulo {
    margin: 0.5rem 0.6rem 0.2rem;
    font-size: 0.6875rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--tinta-suave);
  }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    width: 100%;
    padding: 0.45rem 0.6rem;
    text-align: left;
    font-size: 0.8125rem;
    border-radius: 2px;
  }

  .menu-item:hover,
  .menu-item:focus-visible { background: #ebebeb; }

  .menu-item:focus-visible { outline-offset: -2px; }

  /* La columna del ✓ se reserva siempre, así los nombres no bailan. */
  .menu-item::before {
    content: "";
    flex: 0 0 0.9rem;
  }

  .menu-item[aria-checked="true"]::before { content: "✓"; }

  .menu-separador {
    height: 1px;
    margin: 0.35rem 0;
    background: var(--borde-tenue);
  }

  /* =========================================================
     7. Trabajo en primer plano
     ========================================================= */
  .telon {
    position: fixed;
    inset: 0;
    z-index: 50;
    /* En columna: el visor y la pista son hermanos, así que la pista
       ya no puede montarse sobre los botones de enviar. Las flechas y
       el cerrar van fijos y quedan fuera de este flujo. */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    /* El aire de arriba lo pide el botón de cerrar, y el de los lados
       las flechas: así el visor nunca queda debajo de un control. */
    padding: 4.5rem 5rem 1.5rem;
    background: rgba(245, 245, 245, 0.94);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s var(--curva);
  }

  .telon.abierto { opacity: 1; pointer-events: auto; }

  .visor {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    width: min(52rem, 100%);
    /* Se encoge si hace falta, pero nunca empuja a la pista fuera. */
    flex: 0 1 auto;
    min-height: 0;
    transform: scale(0.97);
    transition: transform 0.25s var(--curva);
  }

  .telon.abierto .visor { transform: scale(1); }

  .visor-hueco {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    aspect-ratio: 4 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--hueco);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    color: var(--tinta-media);
  }

  .visor-hueco img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: var(--hueco);
  }

  /* El video se reproduce con el reproductor de Drive: no hay URL
     directa que un <video> pueda usar. */
  .visor-hueco iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .visor-hueco blockquote {
    margin: 0;
    padding: 2rem;
    max-width: 34rem;
    background: var(--papel);
    font-size: 1.125rem;
    line-height: 1.5;
    color: var(--tinta);
    overflow-y: auto;
  }

  .visor-datos {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.5rem 1.25rem;
    font-size: 0.875rem;
  }

  .visor-datos .curso { font-weight: 600; }
  .visor-datos .linea { color: var(--tinta-media); }

  .visor-datos .indice {
    margin-left: auto;
    font-size: 0.75rem;
    color: var(--tinta-suave);
    font-variant-numeric: tabular-nums;
  }

  .enviar {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
    padding-top: 0.875rem;
    border-top: 1px solid var(--borde-tenue);
  }

  .enviar-rotulo {
    font-size: 0.6875rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--tinta-suave);
    margin-right: 0.25rem;
  }

  /* El margen empuja el aviso y el botón de enviar hacia la derecha,
     aunque el aviso esté vacío. */
  .enviar-estado {
    margin-left: auto;
    font-size: 0.6875rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--tinta-suave);
  }

  .enviar-estado.falla { color: var(--tinta); font-weight: 600; }

  .destino {
    font-size: 0.8125rem;
    padding: 0.45rem 0.8rem;
    border: 1px solid var(--borde-tenue);
    border-radius: var(--radio);
    background: var(--papel);
  }

  .destino:hover { border-color: var(--borde); }

  /* Seleccionado en negativo: el estado se ve sin usar color. */
  .destino[aria-pressed="true"] {
    background: var(--tinta);
    border-color: var(--tinta);
    color: var(--papel);
  }

  .destino[aria-pressed="true"]::before { content: "✓ "; }

  .destino:disabled {
    color: var(--tinta-suave);
    border-color: var(--borde-tenue);
    cursor: not-allowed;
  }

  .flecha {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 2.75rem;
    height: 2.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.125rem;
    background: var(--papel);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
  }

  .flecha:hover { background: var(--tinta); color: var(--papel); }
  .flecha.previa { left: 1.25rem; }
  .flecha.siguiente { right: 1.25rem; }

  .cerrar { position: fixed; top: 1.25rem; right: 1.25rem; }

  .pista {
    flex: 0 0 auto;
    margin: 0;
    font-size: 0.6875rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--tinta-suave);
    pointer-events: none;
  }

  /* =========================================================
     8. Pantalla de aviso
     ========================================================= */
  .pantalla-aviso {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

  .aviso-titulo {

  /* =========================================================
     9. Pantallas chicas y movimiento reducido
     ========================================================= */
  @media (max-width: 700px) {
    /* En celular la grilla 2×2 no cabe: las secciones se apilan

  </div>

  <script>const DATOS = <?!= datosJson ?>;</script>

  <script>
/* =========================================================
   1. Datos
   Los inyecta doGet() como la constante DATOS. Abriendo el
   archivo suelto esa constante no existe: la página lo dice en
   vez de quedar en blanco.
   ========================================================= */
const ARCHIVO = (typeof DATOS !== "undefined") ? DATOS : {
    error: "Esta página se abre desde Apps Script, no como archivo suelto."
};

const CATEGORIAS = ARCHIVO.categorias || [];
const LINEAS = ARCHIVO.lineas || [];
const OBRAS = ARCHIVO.obras || [];

// Lo guardado se cuelga de cada trabajo —en qué nodos está y si está
// oculto— para no andar consultando varias estructuras en paralelo.
const OCULTOS_GUARDADOS = ARCHIVO.ocultos || [];

OBRAS.forEach(function (obra) {
    obra.categorias = (ARCHIVO.clasificacion && ARCHIVO.clasificacion[obra.id]) || [];
    obra.oculta = OCULTOS_GUARDADOS.indexOf(obra.id) !== -1;
});

/* Las cuatro secciones, en el orden de la grilla 2×2. La primera
   muestra todo en grilla; las otras tres son nodos en órbita. */
const SECCIONES = [{
    titulo: "Todos mis trabajos",
    clave: null,
    definicion: null
}].concat(CATEGORIAS.map(function (categoria) {
    return {
        titulo: categoria.titulo,
        clave: categoria.clave,
        definicion: categoria.definicion
    };
}));

// Drive tiene dos formas de servir una miniatura y no siempre funcionan
// las mismas: googleusercontent suele pasar donde drive.google.com da 403,
// sobre todo desde dentro de un iframe como el de Apps Script. Se
// devuelven las dos, en orden, y crearImagen() prueba la siguiente si la
// anterior falla.
function urlesDeMiniatura(obra, ancho) {
    if (obra.tipo === "youtube") {
        // La portada de YouTube es pública: no depende de permisos de
        // Drive y por eso es la que conviene primero.
        const deYoutube = "https://img.youtube.com/vi/" + obra.idVideo + "/hqdefault.jpg";

        // Si además se guardó la portada en Drive, sirve de respaldo.
        if (obra.portada && obra.archivo.slice(-4).toLowerCase() === ".jpg") {
            return [deYoutube].concat(urlesDeDrive(obra.portada, ancho));
        }
        return [deYoutube];
    }

    return urlesDeDrive(obra.id, ancho);
}

function urlesDeDrive(id, ancho) {
    return [
        "https://lh3.googleusercontent.com/d/" + id + "=w" + ancho,
        "https://drive.google.com/thumbnail?id=" + id + "&sz=w" + ancho
    ];
}

// Los videos de Drive no tienen URL directa reproducible: se usa su
// reproductor. Los de YouTube van por el dominio sin cookies, que es el
// mismo reproductor pero sin seguimiento del que mira.
function urlReproductor(obra) {
    if (obra.tipo === "youtube") {
        return "https://www.youtube-nocookie.com/embed/" + obra.idVideo;
    }

    return "https://drive.google.com/file/d/" + obra.id + "/preview";
}

/* =========================================================
   2. Estado
   ========================================================= */
const estado = {
    ampliada: null,       // índice de sección ampliada, o null en vista general
    obra: null,           // trabajo en el visor, o null si está cerrado
    pendientes: [],       // nodos marcados en el visor; se aplican al apretar Enviar

    // Arma la lista por la que navegan las flechas del visor. Es una
    // función y no la lista misma: si la clasificación cambia con el
    // visor abierto, la lista de un nodo cambia, y guardada quedaba vieja.
    listaDelVisor: null,

    seleccion: [],        // ids de los trabajos elegidos para el lote
    destinos: [],         // nodos a los que se manda el lote al confirmar, no antes

    verOcultos: false     // si los trabajos ocultos se muestran, atenuados
};

const tablero = document.getElementById("tablero");
const telon = document.getElementById("telon");
const botonVolver = document.getElementById("volver");
const avisoGuardado = document.getElementById("guardado");

// Con el visor abierto la barra de arriba queda tapada: el aviso de
// guardado se repite junto al botón de enviar.
const avisoDelVisor = document.getElementById("visor-guardado");

// Trabajos que le tocan a una sección. Los ocultos no están en ninguna,
// salvo que se haya pedido verlos.
function obrasDe(seccion) {
    return OBRAS.filter(function (obra) {
        if (obra.oculta && !estado.verOcultos) return false;
        return !seccion.clave || obra.categorias.indexOf(seccion.clave) !== -1;
    });
}

/* =========================================================
   3. Guardado
   No se llama al servidor en cada clic: se junta lo que pasó
   en un segundo y se manda el mapa completo de una vez.
   ========================================================= */
let temporizador = null;

function mapaDeClasificacion() {
    const mapa = {};
    OBRAS.forEach(function (obra) {
        if (obra.categorias.length > 0) mapa[obra.id] = obra.categorias;
    });
    return mapa;
}

function idsOcultos() {
    return OBRAS
        .filter(function (obra) { return obra.oculta; })
        .map(function (obra) { return obra.id; });
}

function mostrarGuardado(texto, falla) {
    [avisoGuardado, avisoDelVisor].forEach(function (aviso) {
        aviso.textContent = texto;
        aviso.classList.toggle("falla", falla === true);
    });
}

function limpiarAvisoDelVisor() {
    avisoDelVisor.textContent = "";
    avisoDelVisor.classList.remove("falla");
}

function programarGuardado() {
    mostrarGuardado("Guardando…");
    clearTimeout(temporizador);
    temporizador = setTimeout(guardarAhora, 900);
}

function guardarAhora() {
    if (typeof google === "undefined" || !google.script) {
        mostrarGuardado("Sin guardar (prueba local)", true);
        return;
    }

    google.script.run
        .withSuccessHandler(function (respuesta) {
            if (respuesta && respuesta.exito) mostrarGuardado("Guardado");
            else mostrarGuardado("No se pudo guardar", true);
        })
        .withFailureHandler(function () {
            mostrarGuardado("No se pudo guardar", true);
        })
        .guardarClasificacion(mapaDeClasificacion(), idsOcultos());
}

/* =========================================================
   4. Fichas
   ========================================================= */
function crearImagen(obra, ancho) {
    const urles = urlesDeMiniatura(obra, ancho);
    let intento = 0;

    const imagen = document.createElement("img");
    imagen.alt = "";
    imagen.loading = "lazy";

    // Sin esto Google ve que la petición viene del iframe de Apps Script
    // y responde 403 a las imágenes que no son públicas.
    imagen.referrerPolicy = "no-referrer";

    // Se prueban las formas de servir la miniatura en orden. Si se
    // acaban, se quita la imagen y queda el rectángulo gris: la ficha
    // sigue siendo utilizable, solo que sin vista previa.
    imagen.addEventListener("error", function () {
        intento++;
        if (intento < urles.length) imagen.src = urles[intento];
        else imagen.remove();
    });

    imagen.src = urles[0];
    return imagen;
}

function crearContenidoDeFicha(obra) {
    if (obra.tipo === "texto") {
        const extracto = document.createElement("p");
        extracto.className = "extracto";

        // El texto va en su propia caja, que es la que se recorta. Así el
        // corte cae en el borde interior del párrafo y se puede reservar
        // la esquina de la casilla; recortando el párrafo, el texto seguía
        // corriendo por debajo de ella.
        const texto = document.createElement("span");
        texto.textContent = obra.contenido;
        extracto.appendChild(texto);

        return [extracto];
    }

    const partes = [crearImagen(obra, 400)];

    if (obra.tipo === "video" || obra.tipo === "youtube") {
        const marca = document.createElement("span");
        marca.className = "marca-video";
        partes.push(marca);
    }

    return partes;
}

// La casilla que selecciona el trabajo sin abrirlo. Solo se pone en la
// grilla: en las órbitas la ficha puede quedar de 22px y no habría dónde
// apuntar.
function crearCasilla(obra) {
    const casilla = document.createElement("button");
    casilla.type = "button";
    casilla.className = "elegir";
    casilla.textContent = "✓";
    casilla.setAttribute("role", "checkbox");
    casilla.setAttribute("aria-checked", String(obraElegida(obra)));
    casilla.setAttribute("aria-label", "Seleccionar " + obra.archivo);

    casilla.addEventListener("click", function () { alternarSeleccion(obra); });
    return casilla;
}

function crearObra(obra, listaDe, conCasilla) {
    const ficha = document.createElement("div");
    ficha.className = "obra" + (conCasilla ? " con-casilla" : "");

    // El mismo trabajo puede tener ficha en varias secciones a la vez.
    ficha.dataset.obra = obra.id;
    if (obraElegida(obra)) ficha.classList.add("elegida");
    if (obra.oculta) ficha.classList.add("oculta");

    // El clic derecho abre el menú propio en vez del del navegador.
    ficha.addEventListener("contextmenu", function (evento) { abrirMenu(evento, obra); });

    // El botón cubre la ficha entera; la casilla va encima, en una esquina.
    const abrir = document.createElement("button");
    abrir.type = "button";
    abrir.className = "obra-abrir";
    abrir.setAttribute("aria-label", obra.archivo + ", " + obra.curso);
    abrir.addEventListener("click", function () { abrirObra(obra, listaDe); });

    crearContenidoDeFicha(obra).forEach(function (parte) { abrir.appendChild(parte); });
    ficha.appendChild(abrir);

    if (obra.categorias.length > 0) {
        const marcas = document.createElement("div");
        marcas.className = "marcas";
        obra.categorias.forEach(function () { marcas.appendChild(document.createElement("i")); });
        ficha.appendChild(marcas);
    }

    if (conCasilla) ficha.appendChild(crearCasilla(obra));

    return ficha;
}

function crearGrilla(lista) {
    const ul = document.createElement("ul");
    ul.className = "obras";

    // Una línea no cambia al clasificar: su lista puede ir fija.
    const listaDe = function () { return lista; };

    lista.forEach(function (obra) {
        const celda = document.createElement("li");
        celda.appendChild(crearObra(obra, listaDe, true));
        ul.appendChild(celda);
    });

    return ul;
}

// La primera sección va agrupada por línea curricular.
function crearPorLinea(lista) {
    const envoltura = document.createDocumentFragment();

    LINEAS.forEach(function (linea) {
        const deLaLinea = lista.filter(function (o) { return o.linea === linea; });
        if (deLaLinea.length === 0) return;

        const grupo = document.createElement("div");
        grupo.className = "grupo-linea";

        const rotulo = document.createElement("h3");
        rotulo.className = "rotulo-linea";
        rotulo.textContent = linea + " · " + deLaLinea.length;
        grupo.appendChild(rotulo);

        grupo.appendChild(crearGrilla(deLaLinea));
        envoltura.appendChild(grupo);
    });

    return envoltura;
}

/* =========================================================
   5. Reparto en anillos
   Toda la geometría de la órbita vive acá. El tamaño de ficha
   sale de la cantidad de trabajos y del radio disponible; si el
   anillo más externo no cabe, se achica la ficha y se vuelve a
   repartir. Por eso pocos trabajos salen grandes y muchos se
   acomodan en más anillos sin desbordarse.
   ========================================================= */
const LADO_MINIMO = 22;
const LADO_MAXIMO = 200;

// Cuántas fichas de este lado caben en una vuelta de este radio.
function capacidadDelAnillo(radio, lado) {
    return Math.max(1, Math.floor((2 * Math.PI * radio) / (lado * 1.12)));
}

// Devuelve las posiciones relativas al centro y el radio externo.
function repartirEnAnillos(cantidad, lado, radioInterior, radioMaximo) {
    const anillos = [];
    let radio = radioInterior + lado * 0.7;
    let colocadas = 0;

    while (colocadas < cantidad) {
        const enEste = Math.min(capacidadDelAnillo(radio, lado), cantidad - colocadas);
        anillos.push({ radio: radio, cuantas: enEste });

        colocadas += enEste;
        if (colocadas < cantidad) radio += lado * 1.18;
    }

    // Con pocos trabajos los anillos quedan pegados al núcleo y todo el
    // borde sobra. Se corre el conjunto hacia afuera para ocupar ese
    // espacio: al haber más circunferencia, la ficha puede ser más
    // grande, que es de dónde sale que pocos trabajos se vean grandes.
    // Se reserva 1px: si el anillo queda justo sobre el límite, el
    // redondeo del navegador hace que a veces mida una milésima de más
    // y las fichas se descarten como si no cupieran. Con el zoom al 90%
    // el redondeo caía para el otro lado y reaparecían.
    const holgura = radioMaximo - (radio + lado / 2) - 1;
    if (holgura > 0) {
        anillos.forEach(function (anillo) { anillo.radio += holgura; });
        radio += holgura;
    }

    const posiciones = [];

    anillos.forEach(function (anillo, i) {
        // Cada anillo se gira medio paso: así las fichas no quedan
        // alineadas en radios y la mancha se ve más pareja.
        const giro = (i % 2) * (Math.PI / anillo.cuantas);

        for (let j = 0; j < anillo.cuantas; j++) {
            const angulo = giro + (j * 2 * Math.PI) / anillo.cuantas - Math.PI / 2;
            posiciones.push({
                x: Math.cos(angulo) * anillo.radio,
                y: Math.sin(angulo) * anillo.radio
            });
        }
    });

    return { posiciones: posiciones, radio: radio, interno: anillos[0].radio };
}

// Busca el lado más grande con el que todo cabe dentro del radio.
// Un tamaño sirve si nada se sale del borde y el anillo interno no se
// mete dentro del núcleo.
function ladoSirve(cantidad, lado, radioMaximo, radioInterior) {
    const reparto = repartirEnAnillos(cantidad, lado, radioInterior, radioMaximo);
    return reparto.radio + lado / 2 <= radioMaximo + 0.5 &&
        reparto.interno - lado / 2 >= radioInterior;
}

// Busca el tamaño más grande que sirva, partiendo del mínimo y subiendo
// de a poco. Antes solo se achicaba desde un tanteo, y con pocos
// trabajos el tanteo se topaba con el núcleo: uno, tres y ocho trabajos
// terminaban todos del mismo porte.
function ajustarLado(cantidad, radioMaximo, radioInterior) {
    let lado = LADO_MINIMO;

    for (let intento = 0; intento < 80; intento++) {
        const prueba = Math.min(LADO_MAXIMO, lado * 1.04);
        if (prueba <= lado) break;   // ya está en el tope
        if (!ladoSirve(cantidad, prueba, radioMaximo, radioInterior)) break;
        lado = prueba;
    }

    const reparto = repartirEnAnillos(cantidad, lado, radioInterior, radioMaximo);
    return { lado: lado, posiciones: reparto.posiciones };
}

// Coloca las fichas ya creadas. Se llama al dibujar y cada vez que
// la sección cambia de tamaño.
function acomodarOrbita(orbita) {
    const fichas = orbita.querySelectorAll(".orbitando");
    if (fichas.length === 0) return;

    const ancho = orbita.clientWidth;
    const alto = orbita.clientHeight;
    if (ancho === 0 || alto === 0) return;   // sección colapsada

    const nucleo = orbita.querySelector(".nucleo");
    const radioMaximo = Math.min(ancho, alto) / 2 - 6;

    // El núcleo es ancho y bajo, así que su lado mayor exagera lo que de
    // verdad estorba: una ficha puesta arriba o abajo no lo toca. Y como
    // el núcleo se dibuja encima con fondo sólido, tampoco necesita el
    // despeje completo. Sin este tope, con pocos trabajos la ficha no
    // podía crecer más que el anillo libre y uno, tres y ocho salían
    // todos del mismo porte.
    const radioInterior = Math.min(
        Math.max(nucleo.offsetWidth, nucleo.offsetHeight) / 2,
        radioMaximo * 0.42
    );

    const plan = ajustarLado(fichas.length, radioMaximo, radioInterior);

    // Con muchos trabajos en un cuadrante chico la ficha toca su piso y
    // el anillo externo ya no cabe. En vez de recortarlo a medias, se
    // muestran los que entran y el núcleo dice cuántos faltan: al
    // ampliar la sección hay radio de sobra y aparecen todos.
    // El margen de 1px es el mismo que reserva repartirEnAnillos: sin él,
    // un anillo que cabe justo se descarta entero por redondeo.
    const caben = plan.posiciones.filter(function (punto) {
        return Math.hypot(punto.x, punto.y) + plan.lado / 2 <= radioMaximo + 1;
    }).length;

    fichas.forEach(function (ficha, i) {
        if (i >= caben) {
            ficha.hidden = true;
            return;
        }

        const punto = plan.posiciones[i];
        ficha.hidden = false;
        ficha.style.width = plan.lado + "px";
        ficha.style.left = (ancho / 2 + punto.x) + "px";
        ficha.style.top = (alto / 2 + punto.y) + "px";
        ficha.classList.toggle("diminuta", plan.lado < 60);
    });

    const resto = orbita.querySelector(".resto");
    const faltan = fichas.length - caben;
    resto.textContent = faltan > 0 ? "+" + faltan + " al ampliar" : "";
    resto.hidden = faltan === 0;
}

/* =========================================================
   6. Construcción de la pantalla
   ========================================================= */
function crearNucleo(seccion, indice, cantidad) {
    const nucleo = document.createElement("div");
    nucleo.className = "nucleo";

    const titulo = document.createElement("button");
    titulo.type = "button";
    titulo.className = "titulo-nodo";
    titulo.innerHTML = seccion.titulo + '<br><span class="cuenta">' + cantidad + "</span>";
    titulo.addEventListener("click", function () { ampliar(indice); });
    nucleo.appendChild(titulo);

    // Sin definición escrita por la carrera, el nodo va solo con su título.
    if (seccion.definicion) {
        const definicion = document.createElement("p");
        definicion.className = "definicion";
        definicion.textContent = seccion.definicion;
        nucleo.appendChild(definicion);
    }

    if (cantidad === 0) {
        const vacio = document.createElement("p");
        vacio.className = "vacio-nodo";
        vacio.textContent = "Abre un trabajo desde «Todos mis trabajos» y mándalo a este nodo.";
        nucleo.appendChild(vacio);
    }

    // Lo llena acomodarOrbita() cuando no alcanzan a caber todos.
    const resto = document.createElement("p");
    resto.className = "resto";
    resto.hidden = true;
    nucleo.appendChild(resto);

    return nucleo;
}

function crearOrbita(seccion, indice, lista) {
    const orbita = document.createElement("div");
    orbita.className = "orbita";
    orbita.appendChild(crearNucleo(seccion, indice, lista.length));

    // Un nodo sí cambia al clasificar: su lista se vuelve a pedir cada vez.
    const listaDe = function () { return obrasDe(seccion); };

    lista.forEach(function (obra) {
        const ficha = crearObra(obra, listaDe, false);
        ficha.classList.add("orbitando");
        orbita.appendChild(ficha);
    });

    return orbita;
}

function crearSeccion(seccion, indice) {
    const nodo = document.createElement("section");
    nodo.className = "seccion";

    // Solo la primera lleva encabezado: en los nodos el título va al
    // centro de la órbita y es el que abre la sección.
    if (seccion.clave === null) {
        const cabecera = document.createElement("div");
        cabecera.className = "seccion-cabecera";

        const titulo = document.createElement("button");
        titulo.type = "button";
        titulo.className = "titulo-seccion";
        titulo.addEventListener("click", function () { ampliar(indice); });

        cabecera.appendChild(titulo);
        nodo.appendChild(cabecera);
        seccion.nodoTitulo = titulo;
    }

    const cuerpo = document.createElement("div");
    cuerpo.className = "seccion-cuerpo" + (seccion.clave ? " cuerpo-orbita" : "");
    nodo.appendChild(cuerpo);

    seccion.nodoCuerpo = cuerpo;
    return nodo;
}

function refrescarSeccion(seccion, indice) {
    const lista = obrasDe(seccion);

    // La sección se vacía y se vuelve a llenar. Sin guardar dónde iba, cada
    // clasificación devolvía la grilla al principio.
    const desplazado = seccion.nodoCuerpo.scrollTop;
    seccion.nodoCuerpo.innerHTML = "";

    if (seccion.clave === null) {
        seccion.nodoTitulo.innerHTML = seccion.titulo +
            ' <span class="cuenta">' + lista.length + "</span>";
        seccion.nodoCuerpo.appendChild(crearPorLinea(lista));
        seccion.nodoCuerpo.scrollTop = desplazado;
        return;
    }

    const orbita = crearOrbita(seccion, indice, lista);
    seccion.nodoCuerpo.appendChild(orbita);
    acomodarOrbita(orbita);
}

function refrescar() {
    SECCIONES.forEach(refrescarSeccion);
}

// La órbita depende del tamaño de la sección, y ese tamaño cambia al
// ampliar y al mover la ventana. Se recalcula en cada cambio, así la
// órbita se abre junto con la sección.
function vigilarTamanos() {
    if (typeof ResizeObserver === "undefined") return;

    const vigia = new ResizeObserver(function (entradas) {
        entradas.forEach(function (entrada) {
            const orbita = entrada.target.querySelector(".orbita");
            if (orbita) acomodarOrbita(orbita);
        });
    });

    SECCIONES.forEach(function (seccion) {
        if (seccion.clave) vigia.observe(seccion.nodoCuerpo);
    });
}

/* =========================================================
   7. Las dos vistas
   No hay zoom gradual: la grilla pasa de 1fr 1fr a 1fr 0fr (o
   la combinación que toque) y la sección elegida crece en su
   lugar. Las otras se colapsan y se apagan.
   ========================================================= */
const COLUMNAS = ["1fr 0fr", "0fr 1fr", "1fr 0fr", "0fr 1fr"];
const FILAS    = ["1fr 0fr", "1fr 0fr", "0fr 1fr", "0fr 1fr"];

function aplicarVista() {
    const ampliada = estado.ampliada;
    const hayAmpliada = ampliada !== null;

    tablero.style.gridTemplateColumns = hayAmpliada ? COLUMNAS[ampliada] : "1fr 1fr";
    tablero.style.gridTemplateRows = hayAmpliada ? FILAS[ampliada] : "1fr 1fr";
    tablero.classList.toggle("ampliada", hayAmpliada);

    Array.prototype.forEach.call(tablero.children, function (nodo, i) {
        nodo.classList.toggle("apagada", hayAmpliada && i !== ampliada);
    });

    botonVolver.hidden = !hayAmpliada;
}

function ampliar(indice) {
    estado.ampliada = indice;
    aplicarVista();
}

function volverAGeneral() {
    estado.ampliada = null;
    aplicarVista();
}

// En vista de sección, las flechas pasan a la sección contigua.
function moverSeccion(paso) {
    if (estado.ampliada === null) return;
    const total = SECCIONES.length;
    ampliar((estado.ampliada + paso + total) % total);
}

/* =========================================================
   8. Trabajo en primer plano
   ========================================================= */
function abrirObra(obra, listaDe) {
    estado.obra = obra;
    estado.listaDelVisor = listaDe;
    pintarVisor();
    telon.classList.add("abierto");
    document.getElementById("cerrar").focus();
}

function cerrarObra() {
    estado.obra = null;
    estado.listaDelVisor = null;
    estado.pendientes = [];   // lo marcado y no enviado se descarta
    telon.classList.remove("abierto");
    // Se vacía para que un video no siga sonando detrás del telón.
    document.getElementById("visor-hueco").innerHTML = "";
}

// Las flechas pasan al trabajo siguiente o anterior sin cerrar. La lista
// se pide de nuevo en cada paso, así recorren el nodo como está ahora y
// no como estaba al abrir el visor.
function moverObra(paso) {
    if (estado.obra === null) return;

    const lista = estado.listaDelVisor();
    const total = lista.length;
    if (total === 0) return;

    // Si el trabajo en pantalla salió del nodo, se parte del lugar que
    // ocupaba: hacia adelante toca el que quedó en ese lugar, y hacia
    // atrás el de antes.
    const puesto = lista.indexOf(estado.obra);
    const desde = puesto !== -1
        ? puesto + paso
        : lugarEn(lista, estado.obra) + (paso > 0 ? 0 : -1);

    estado.obra = lista[(desde + total) % total];
    pintarVisor();
}

// Dónde iría el trabajo si estuviera en la lista. Las listas respetan el
// orden de OBRAS, así que es cuántos de ella van antes que él.
function lugarEn(lista, obra) {
    const orden = OBRAS.indexOf(obra);
    return lista.filter(function (otra) { return OBRAS.indexOf(otra) < orden; }).length;
}

function crearVistaGrande(obra) {
    if (obra.tipo === "texto") {
        const cita = document.createElement("blockquote");
        cita.textContent = obra.contenido;
        return cita;
    }

    if (obra.tipo === "video" || obra.tipo === "youtube") {
        const marco = document.createElement("iframe");
        marco.src = urlReproductor(obra);
        marco.allow = "autoplay; encrypted-media; picture-in-picture";
        marco.setAttribute("allowfullscreen", "");
        marco.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
        return marco;
    }

    return crearImagen(obra, 1600);
}

function pintarVisor() {
    const obra = estado.obra;
    const hueco = document.getElementById("visor-hueco");

    hueco.innerHTML = "";
    hueco.appendChild(crearVistaGrande(obra));

    document.getElementById("visor-curso").textContent = obra.curso;
    document.getElementById("visor-linea").textContent = obra.linea;

    // Cada trabajo parte de cómo está guardado: lo marcado y no enviado en
    // el anterior se descarta al pasar a otro.
    estado.pendientes = obra.categorias.slice();
    limpiarAvisoDelVisor();

    pintarIndice();
    pintarDestinos(obra);
}

// Aparte de pintarVisor(): al clasificar hay que poner al día la cuenta
// sin volver a cargar la imagen o el video que se está mirando.
function pintarIndice() {
    const lista = estado.listaDelVisor();
    const puesto = lista.indexOf(estado.obra);

    document.getElementById("visor-indice").textContent = puesto !== -1
        ? (puesto + 1) + " / " + lista.length
        : "Ya no está en este nodo";
}

// Manda o saca el trabajo de un nodo, al instante. Puede estar en varios
// a la vez, y sigue estando en "Todos mis trabajos". La usa el menú del
// clic derecho; el visor marca primero y aplica con "Enviar".
function alternarCategoria(obra, clave) {
    const puesto = obra.categorias.indexOf(clave);
    if (puesto === -1) obra.categorias.push(clave);
    else obra.categorias.splice(puesto, 1);

    programarGuardado();
    refrescar();
}

// En el visor, un clic en un nodo solo lo marca o lo desmarca.
function alternarPendiente(clave) {
    const puesto = estado.pendientes.indexOf(clave);
    if (puesto === -1) estado.pendientes.push(clave);
    else estado.pendientes.splice(puesto, 1);

    // Un "Guardado" que quedara a la vista haría creer que lo recién
    // marcado ya se guardó.
    limpiarAvisoDelVisor();
    actualizarDestinos(estado.obra);
}

// Hay algo que enviar si lo marcado es distinto de lo guardado.
function hayPendientes(obra) {
    return CATEGORIAS.some(function (categoria) {
        return (obra.categorias.indexOf(categoria.clave) !== -1) !==
            (estado.pendientes.indexOf(categoria.clave) !== -1);
    });
}

// Recién acá cambia la clasificación del trabajo abierto: entra a los
// nodos marcados y sale de los desmarcados.
function enviarPendientes() {
    const obra = estado.obra;
    if (obra === null || !hayPendientes(obra)) return;

    CATEGORIAS.forEach(function (categoria) {
        const puesto = obra.categorias.indexOf(categoria.clave);
        const quiere = estado.pendientes.indexOf(categoria.clave) !== -1;

        if (quiere && puesto === -1) obra.categorias.push(categoria.clave);
        if (!quiere && puesto !== -1) obra.categorias.splice(puesto, 1);
    });

    programarGuardado();
    refrescar();
    actualizarDestinos(obra);

    // El trabajo sigue en pantalla aunque haya salido del nodo, para poder
    // corregirlo; lo que cambia es la cuenta.
    pintarIndice();
}

function pintarDestinos(obra) {
    const zona = document.getElementById("enviar");
    zona.querySelectorAll(".destino, .enviar-boton").forEach(function (n) { n.remove(); });

    // Los nodos van antes del aviso de guardado, y el botón al final.
    CATEGORIAS.forEach(function (categoria) {
        const boton = document.createElement("button");
        boton.type = "button";
        boton.className = "destino";
        boton.dataset.clave = categoria.clave;
        boton.textContent = categoria.titulo;
        boton.addEventListener("click", function () { alternarPendiente(categoria.clave); });
        zona.insertBefore(boton, avisoDelVisor);
    });

    const enviar = document.createElement("button");
    enviar.type = "button";
    enviar.className = "boton fuerte enviar-boton";
    enviar.textContent = "Enviar";
    enviar.addEventListener("click", enviarPendientes);
    zona.appendChild(enviar);

    actualizarDestinos(obra);
}

// Solo cambia las marcas y el estado del botón. Sin rehacer los botones,
// el foco del teclado no se pierde a cada clic.
function actualizarDestinos(obra) {
    const zona = document.getElementById("enviar");

    zona.querySelectorAll(".destino").forEach(function (boton) {
        boton.setAttribute("aria-pressed",
            String(estado.pendientes.indexOf(boton.dataset.clave) !== -1));
    });
    zona.querySelector(".enviar-boton").disabled = !hayPendientes(obra);
}

/* =========================================================
   9. Selección múltiple
   Permite mandar varios trabajos a un nodo de una vez, sin
   tener que abrirlos uno por uno.
   ========================================================= */
const lote = document.getElementById("lote");
const loteCuenta = document.getElementById("lote-cuenta");
const loteDestinos = document.getElementById("lote-destinos");
const botonConfirmar = document.getElementById("lote-confirmar");

function obraElegida(obra) {
    return estado.seleccion.indexOf(obra.id) !== -1;
}

function obrasSeleccionadas() {
    return OBRAS.filter(obraElegida);
}

// Todas las fichas de ese trabajo, estén en la sección que estén,
// tienen que reflejar lo mismo.
function marcarFichas(obra) {
    const elegida = obraElegida(obra);

    document.querySelectorAll('[data-obra="' + obra.id + '"]').forEach(function (ficha) {
        ficha.classList.toggle("elegida", elegida);

        const casilla = ficha.querySelector(".elegir");
        if (casilla) casilla.setAttribute("aria-checked", String(elegida));
    });
}

function alternarSeleccion(obra) {
    const puesto = estado.seleccion.indexOf(obra.id);
    if (puesto === -1) estado.seleccion.push(obra.id);
    else estado.seleccion.splice(puesto, 1);

    marcarFichas(obra);
    pintarLote();
}

// Un clic elige o descarta un nodo para el lote. No escribe nada todavía.
function alternarDestino(clave) {
    const puesto = estado.destinos.indexOf(clave);
    if (puesto === -1) estado.destinos.push(clave);
    else estado.destinos.splice(puesto, 1);

    pintarLote();
}

// Recién acá se toca la clasificación: cada trabajo del lote entra a los
// nodos elegidos. No se saca a ninguno de ningún nodo: la barra no muestra
// dónde está cada uno, y sacar a ciegas sería perder trabajo. Para sacar
// uno de un nodo están el visor y el clic derecho.
function confirmarSeleccion() {
    const lista = obrasSeleccionadas();
    if (lista.length === 0 || estado.destinos.length === 0) return;

    lista.forEach(function (obra) {
        estado.destinos.forEach(function (clave) {
            if (obra.categorias.indexOf(clave) === -1) obra.categorias.push(clave);
        });
    });

    programarGuardado();
    limpiarSeleccion();

    // Con el teclado se llega a la barra del lote aun con el visor abierto.
    // Lo marcado en el visor se rehace desde lo guardado: si no, un Enviar
    // posterior sacaría al trabajo de los nodos que el lote le acaba de dar.
    if (estado.obra !== null) {
        estado.pendientes = estado.obra.categorias.slice();
        pintarIndice();
        pintarDestinos(estado.obra);
    }
}

// Los botones empiezan todos sin marcar, aunque algunos trabajos ya estén
// en ese nodo. Con varios elegidos, mostrar "ya está" o "3/8" confundía
// más de lo que ayudaba: no se sabía cuál estaba dónde.
function pintarLote() {
    const lista = obrasSeleccionadas();

    lote.hidden = lista.length === 0;
    if (lista.length === 0) return;

    loteCuenta.textContent = lista.length + " seleccionado(s)";
    loteDestinos.innerHTML = "";

    CATEGORIAS.forEach(function (categoria) {
        const boton = document.createElement("button");
        boton.type = "button";
        boton.className = "destino";
        boton.textContent = categoria.titulo;
        boton.setAttribute("aria-pressed",
            String(estado.destinos.indexOf(categoria.clave) !== -1));
        boton.addEventListener("click", function () { alternarDestino(categoria.clave); });
        loteDestinos.appendChild(boton);
    });

    botonConfirmar.disabled = estado.destinos.length === 0;
}

// No hay modo de selección: las casillas están siempre y la barra de
// acciones aparece sola en cuanto hay algo marcado.
//
// Limpia también los destinos: sin eso, lo que el estudiante decidió
// para un lote se arrastraba al siguiente y podía aplicarse a trabajos
// que nunca miró.
function limpiarSeleccion() {
    estado.seleccion = [];
    estado.destinos = [];
    refrescar();   // repinta las fichas sin la marca de elegidas
    pintarLote();
}

/* =========================================================
   10. Menú del clic derecho y trabajos ocultos
   El menú actúa sobre un solo trabajo, el que se tocó, aunque
   haya otros seleccionados: así nunca hace más de lo que se ve.
   ========================================================= */
const menu = document.getElementById("menu");
const botonOcultos = document.getElementById("ver-ocultos");
let obraDelMenu = null;

function abrirMenu(evento, obra) {
    evento.preventDefault();

    obraDelMenu = obra;
    pintarMenu();
    menu.hidden = false;

    // Con el mouse, el menú sale donde se hizo clic. Con el teclado (tecla
    // de menú o Mayús+F10) ese punto no cae sobre la ficha: sale al medio.
    const ficha = evento.currentTarget.getBoundingClientRect();
    let x = evento.clientX;
    let y = evento.clientY;

    if (x < ficha.left || x > ficha.right || y < ficha.top || y > ficha.bottom) {
        x = ficha.left + ficha.width / 2;
        y = ficha.top + ficha.height / 2;
    }

    // Si no cabe hacia la derecha o hacia abajo, se corre hacia adentro.
    const margen = 8;
    menu.style.left = Math.max(margen, Math.min(x, innerWidth - menu.offsetWidth - margen)) + "px";
    menu.style.top = Math.max(margen, Math.min(y, innerHeight - menu.offsetHeight - margen)) + "px";

    itemsDelMenu()[0].focus();
}

function cerrarMenu() {
    if (menu.hidden) return;
    menu.hidden = true;
    obraDelMenu = null;
}

// Al cerrar con el teclado, el foco vuelve a la ficha y no se pierde.
function cerrarMenuYVolver() {
    const obra = obraDelMenu;
    cerrarMenu();

    const ficha = obra && document.querySelector('[data-obra="' + obra.id + '"] .obra-abrir');
    if (ficha) ficha.focus();
}

function itemsDelMenu() {
    return Array.prototype.slice.call(menu.querySelectorAll(".menu-item"));
}

function crearItemDeMenu(texto, rol, accion) {
    const item = document.createElement("button");
    item.type = "button";
    item.className = "menu-item";
    item.setAttribute("role", rol);
    item.textContent = texto;
    item.addEventListener("click", accion);
    return item;
}

function pintarMenu() {
    const obra = obraDelMenu;
    menu.innerHTML = "";

    // Las fichas no llevan nombre: el curso dice sobre cuál se abrió.
    const titulo = document.createElement("p");
    titulo.className = "menu-titulo";
    titulo.textContent = obra.curso;
    menu.appendChild(titulo);

    const rotulo = document.createElement("p");
    rotulo.className = "menu-rotulo";
    rotulo.textContent = "Enviar a";
    menu.appendChild(rotulo);

    // Un solo trabajo: acá sí sirve ver en qué nodos está.
    CATEGORIAS.forEach(function (categoria) {
        const item = crearItemDeMenu(categoria.titulo, "menuitemcheckbox", function () {
            alternarCategoria(obra, categoria.clave);
            item.setAttribute("aria-checked",
                String(obra.categorias.indexOf(categoria.clave) !== -1));
            // Queda abierto, para poder mandarlo a más de un nodo seguido.
        });
        item.setAttribute("aria-checked",
            String(obra.categorias.indexOf(categoria.clave) !== -1));
        menu.appendChild(item);
    });

    const separador = document.createElement("div");
    separador.className = "menu-separador";
    separador.setAttribute("role", "separator");
    menu.appendChild(separador);

    const texto = obra.oculta ? "Mostrar trabajo" : "Ocultar trabajo";
    menu.appendChild(crearItemDeMenu(texto, "menuitem", function () {
        cambiarOculto(obra, !obra.oculta);
        cerrarMenu();
    }));
}

function manejarTecladoDelMenu(evento) {
    const items = itemsDelMenu();
    const actual = items.indexOf(document.activeElement);

    if (evento.key === "Escape") {
        cerrarMenuYVolver();
    } else if (evento.key === "Tab") {
        // Sin preventDefault: el Tab sigue su camino desde la ficha.
        cerrarMenuYVolver();
        return;
    } else if (evento.key === "ArrowDown" || evento.key === "ArrowUp") {
        const paso = evento.key === "ArrowDown" ? 1 : -1;
        const desde = actual === -1 ? (paso > 0 ? -1 : items.length) : actual;
        items[(desde + paso + items.length) % items.length].focus();
    } else if (evento.key === "Home") {
        items[0].focus();
    } else if (evento.key === "End") {
        items[items.length - 1].focus();
    } else {
        return;   // Enter y espacio los resuelve el botón
    }

    evento.preventDefault();
}

// Un trabajo oculto sale de la grilla y de los nodos, pero conserva sus
// nodos: al mostrarlo vuelve a estar donde estaba.
function cambiarOculto(obra, oculta) {
    obra.oculta = oculta;

    const quedan = OBRAS.some(function (otra) { return otra.oculta; });
    if (!quedan) estado.verOcultos = false;
    if (!estado.verOcultos) sacarOcultosDeLaSeleccion();

    programarGuardado();
    refrescar();
    pintarOcultos();
    pintarLote();
}

// Un oculto que siguiera seleccionado sin verse se clasificaría a ciegas
// al confirmar el lote.
function sacarOcultosDeLaSeleccion() {
    estado.seleccion = estado.seleccion.filter(function (id) {
        return !OBRAS.some(function (obra) { return obra.id === id && obra.oculta; });
    });
}

function alternarVerOcultos() {
    estado.verOcultos = !estado.verOcultos;
    if (!estado.verOcultos) sacarOcultosDeLaSeleccion();

    refrescar();
    pintarOcultos();
    pintarLote();
}

// El botón solo existe si hay algo oculto: es la única forma de recuperarlo.
function pintarOcultos() {
    const cuantos = OBRAS.filter(function (obra) { return obra.oculta; }).length;

    botonOcultos.hidden = cuantos === 0;
    botonOcultos.textContent = estado.verOcultos
        ? "Esconder ocultos"
        : "Ver ocultos (" + cuantos + ")";
    botonOcultos.setAttribute("aria-pressed", String(estado.verOcultos));
}

/* =========================================================
   11. Teclado y escuchas
   Con el menú abierto, el teclado es del menú. Si no, con un
   trabajo abierto las flechas mueven trabajos; y si no hay
   trabajo abierto pero sí una sección ampliada, mueven secciones.
   ========================================================= */
document.addEventListener("keydown", function (evento) {
    if (!menu.hidden) {
        manejarTecladoDelMenu(evento);
        return;
    }

    const enVisor = estado.obra !== null;

    if (evento.key === "Escape") {
        if (enVisor) cerrarObra();
        else if (estado.seleccion.length > 0) limpiarSeleccion();
        else volverAGeneral();
        return;
    }

    if (evento.key === "ArrowLeft" || evento.key === "ArrowRight") {
        const paso = evento.key === "ArrowRight" ? 1 : -1;
        if (enVisor) moverObra(paso);
        else moverSeccion(paso);
        evento.preventDefault();
    }
});

telon.addEventListener("click", function (evento) {
    // Clic en el fondo atenuado, fuera del visor: cierra.
    if (evento.target === telon) cerrarObra();
});

document.getElementById("previa").addEventListener("click", function () { moverObra(-1); });
document.getElementById("siguiente").addEventListener("click", function () { moverObra(1); });
document.getElementById("cerrar").addEventListener("click", cerrarObra);
botonVolver.addEventListener("click", volverAGeneral);

document.getElementById("lote-limpiar").addEventListener("click", limpiarSeleccion);
botonConfirmar.addEventListener("click", confirmarSeleccion);

botonOcultos.addEventListener("click", alternarVerOcultos);

// El menú se cierra con un clic fuera, al girar la rueda o al cambiar la
// ventana: si no, quedaría flotando lejos del trabajo al que se refiere.
// No se usa el evento scroll: refrescar() también desplaza, y cerraría el
// menú cada vez que se manda un trabajo a un nodo desde él.
document.addEventListener("pointerdown", function (evento) {
    if (!menu.hidden && !menu.contains(evento.target)) cerrarMenu();
}, true);
document.addEventListener("wheel", cerrarMenu, { passive: true });
window.addEventListener("resize", cerrarMenu);
window.addEventListener("blur", cerrarMenu);
menu.addEventListener("contextmenu", function (evento) { evento.preventDefault(); });

/* =========================================================
   12. Arranque

function mostrarAviso(titulo, texto) {
    document.getElementById("aviso-titulo").textContent = titulo;
    document.getElementById("aviso-texto").textContent = texto;
    document.getElementById("pantalla-aviso").hidden = false;
    tablero.hidden = true;
    lote.hidden = true;
}

function iniciar() {
    if (ARCHIVO.error) {
        mostrarAviso("No pudimos abrir tu archivo", ARCHIVO.error);
        return;
    }

    document.getElementById("estudiante").textContent = ARCHIVO.nombre || ARCHIVO.correo;

    const enlace = document.getElementById("drive");
    if (ARCHIVO.urlCarpeta) enlace.href = ARCHIVO.urlCarpeta;
    else enlace.hidden = true;

    if (OBRAS.length === 0) {
        mostrarAviso("Todavía no hay nada acá",
            "Cuando subas trabajos por el formulario, van a aparecer en esta página.");
        return;
    }

    SECCIONES.forEach(function (seccion, i) {
        tablero.appendChild(crearSeccion(seccion, i));
    });

    refrescar();
    vigilarTamanos();
    aplicarVista();
    pintarOcultos();
}

iniciar();
  </script>
