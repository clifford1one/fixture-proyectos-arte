<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archivo de prácticas — Visualizador</title>

  <style>
    /* =========================================================
       1. Base
       Escala de grises sobre #f5f5f5, sin colores de acento.
       ========================================================= */
    :root {
      --fondo: #f5f5f5;
      --papel: #fdfdfd;
      --hueco: #e4e4e4;
      --tinta: #1a1a1a;
      --tinta-media: #555555;
      --tinta-suave: #8a8a8a;
      --borde: #1a1a1a;
      --borde-tenue: #c9c9c9;
      --radio: 3px;

      --paso: 0.45s;
      --curva: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      /* El tablero ocupa la pantalla: no hay scroll de página, cada
         sección se desplaza por dentro. */
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--fondo);
      color: var(--tinta);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font-family: inherit;
      color: inherit;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    :focus-visible {
      outline: 2px solid var(--tinta);
      outline-offset: 2px;
    }

    /* =========================================================
       2. Barra superior
       ========================================================= */
    .barra {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.75rem 1.5rem;
      padding: 1.25rem 1.75rem;
      border-bottom: 1px solid var(--borde);
    }

    .barra h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .estudiante {
      font-size: 0.875rem;
      color: var(--tinta-media);
    }

    .acciones {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.625rem;
    }

    .boton {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 0.5rem 0.875rem;
      border: 1px solid var(--borde-tenue);
      border-radius: var(--radio);
      text-decoration: none;
      color: var(--tinta);
      white-space: nowrap;
    }

    .boton:hover { background: #ebebeb; border-color: var(--borde); }

    .boton.fuerte {
      background: var(--tinta);
      border-color: var(--tinta);
      color: var(--papel);
    }

    .boton.fuerte:hover { background: #000; }

    /* =========================================================
       3. Tablero 2×2
       La transición entre vistas es la grilla misma: la sección
       elegida pasa a 1fr y las otras a 0fr, así que crece en su
       lugar en vez de aparecer como una pantalla nueva.
       ========================================================= */
    .tablero {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 1px;
      background: var(--borde-tenue);
      min-height: 0;
      transition:
        grid-template-columns var(--paso) var(--curva),
        grid-template-rows var(--paso) var(--curva);
    }

    .seccion {
      display: flex;
      flex-direction: column;
      background: var(--fondo);
      /* Sin esto las secciones no se dejan encoger a 0fr. */
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      transition: opacity var(--paso) var(--curva);
    }

    /* Las que no son la elegida se apagan mientras se colapsan. */
    .seccion.apagada {
      opacity: 0;
      pointer-events: none;
    }

    .seccion-cabecera {
      flex: 0 0 auto;
      padding: 1.25rem 1.5rem 0.875rem;
    }

    .titulo-seccion {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0;
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: -0.005em;
    }

    .titulo-seccion:hover { text-decoration: underline; text-underline-offset: 3px; }

    .cuenta {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--tinta-suave);
      font-variant-numeric: tabular-nums;
    }

    .seccion-cuerpo {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 0 1.5rem 1.5rem;
    }

    .tablero.ampliada .seccion:not(.apagada) .seccion-cabecera { padding: 2rem 2.5rem 1.25rem; }
    .tablero.ampliada .seccion:not(.apagada) .seccion-cuerpo { padding: 0 2.5rem 2.5rem; }
    .tablero.ampliada .seccion:not(.apagada) .titulo-seccion { font-size: 1.5rem; }

    /* =========================================================
       4. Órbita
       Los nodos temáticos no van en grilla: el título queda al
       centro y las obras giran alrededor. El tamaño de cada obra
       lo decide el JavaScript según cuántas haya, así que pocas
       obras se ven grandes y muchas se reparten en más anillos.
       ========================================================= */
    .cuerpo-orbita {
      position: relative;
      overflow: hidden;
      padding: 0;
    }

    .orbita { position: absolute; inset: 0; }

    .nucleo {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      max-width: 66%;
      text-align: center;
      /* El fondo despeja el centro por si un anillo queda muy cerca. */
      background: var(--fondo);
      border-radius: 50%;
      padding: 0.75rem 1rem;
    }

    .titulo-nodo {
      padding: 0;
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: -0.005em;
      line-height: 1.25;
      text-wrap: balance;
    }

    .titulo-nodo:hover { text-decoration: underline; text-underline-offset: 3px; }

    .tablero.ampliada .seccion:not(.apagada) .titulo-nodo { font-size: 1.5rem; }

    /* La definición la escribe la carrera, no el estudiante. En vista
       general no cabe: aparece solo cuando la sección está ampliada. */
    .definicion {
      display: none;
      margin: 0;
      max-width: 30rem;
      font-size: 0.9375rem;
      line-height: 1.5;
      color: var(--tinta-media);
      text-wrap: pretty;
    }

    .tablero.ampliada .seccion:not(.apagada) .definicion { display: block; }

    /* =========================================================
       5. Obras
       ========================================================= */
    .grupo-linea { margin-bottom: 1.5rem; }

    .rotulo-linea {
      margin: 0 0 0.5rem;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--tinta-suave);
    }

    .obras {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(5rem, 1fr));
      gap: 0.625rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .tablero.ampliada .seccion:not(.apagada) .obras {
      grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr));
      gap: 1rem;
    }

    .obra {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      padding: 0;
      background: var(--hueco);
      border: 1px solid var(--borde);
      border-radius: var(--radio);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      color: var(--tinta-media);
      transition: transform 0.15s var(--curva), box-shadow 0.15s var(--curva);
    }

    /* Al pasar el mouse crece y se dibuja por encima de las demás. */
    .obra:hover,
    .obra:focus-visible {
      transform: scale(1.08);
      z-index: 5;
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.18);
    }

    /* En órbita la posición la pone el JavaScript, así que el crecer
       al pasar el mouse tiene que conservar el centrado. */
    .obra.orbitando { position: absolute; transform: translate(-50%, -50%); }

    .obra.orbitando:hover,
    .obra.orbitando:focus-visible { transform: translate(-50%, -50%) scale(1.14); }

    /* Un punto por cada categoría a la que fue enviada la obra.
       Es lo único que delata, en "Todos los proyectos", que un
       mismo trabajo ya está clasificado — y en cuántas partes. */
    .obra .marcas {
      position: absolute;
      left: 0.3rem;
      bottom: 0.3rem;
      display: flex;
      gap: 0.2rem;
    }

    .obra .marcas i {
      width: 0.3rem;
      height: 0.3rem;
      border-radius: 50%;
      background: var(--tinta-media);
    }

    /* Con fichas muy chicas los puntos estorban más de lo que informan. */
    .obra.diminuta .marcas { display: none; }

    .vacio-nodo {
      margin: 0;
      font-size: 0.8125rem;
      color: var(--tinta-suave);
      max-width: 22rem;
    }

    /* =========================================================
       6. Obra en primer plano
       ========================================================= */
    .telon {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: rgba(245, 245, 245, 0.94);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s var(--curva);
    }

    .telon.abierto { opacity: 1; pointer-events: auto; }

    .visor {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: min(52rem, 100%);
      max-height: 100%;
      transform: scale(0.97);
      transition: transform 0.25s var(--curva);
    }

    .telon.abierto .visor { transform: scale(1); }

    .visor-hueco {
      flex: 1 1 auto;
      min-height: 0;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--hueco);
      border: 1px solid var(--borde);
      border-radius: var(--radio);
      font-size: 2rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--tinta-media);
    }

    .visor-datos {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.5rem 1.25rem;
      font-size: 0.875rem;
    }

    .visor-datos .curso { font-weight: 600; }
    .visor-datos .linea { color: var(--tinta-media); }

    .visor-datos .indice {
      margin-left: auto;
      font-size: 0.75rem;
      color: var(--tinta-suave);
      font-variant-numeric: tabular-nums;
    }

    /* Enviar la obra a una o más categorías, desde el primer plano. */
    .enviar {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      padding-top: 0.875rem;
      border-top: 1px solid var(--borde-tenue);
    }

    .enviar-rotulo {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--tinta-suave);
      margin-right: 0.25rem;
    }

    .destino {
      font-size: 0.8125rem;
      padding: 0.45rem 0.8rem;
      border: 1px solid var(--borde-tenue);
      border-radius: var(--radio);
      background: var(--papel);
    }

    .destino:hover { border-color: var(--borde); }

    /* Seleccionada en negativo: el estado se ve sin usar color. */
    .destino[aria-pressed="true"] {
      background: var(--tinta);
      border-color: var(--tinta);
      color: var(--papel);
    }

    .destino[aria-pressed="true"]::before { content: "✓ "; }

    /* Parte del lote ya está en esa categoría, parte no. */
    .destino.parcial::before { content: "– "; }

    .destino:disabled {
      color: var(--tinta-suave);
      border-color: var(--borde-tenue);
      cursor: not-allowed;
    }

    /* =========================================================
       Selección múltiple
       En modo selección el clic elige en vez de abrir, y la
       categoría se aplica a todo el lote de una vez.
       ========================================================= */
    .obra.elegida {
      background: var(--tinta);
      border-color: var(--tinta);
      color: var(--papel);
    }

    .obra.elegida .marcas i { background: var(--papel); }

    .seleccionando .obra { cursor: copy; }

    .lote {
      position: fixed;
      left: 50%;
      bottom: 1.25rem;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      max-width: calc(100% - 2rem);
      padding: 0.75rem 1rem;
      background: var(--papel);
      border: 1px solid var(--borde);
      border-radius: var(--radio);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.14);
    }

    .lote-cuenta {
      font-size: 0.75rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      margin-right: 0.25rem;
    }

    .lote-destinos {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem;
    }

    .flecha {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 2.75rem;
      height: 2.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.125rem;
      background: var(--papel);
      border: 1px solid var(--borde);
      border-radius: var(--radio);
    }

    .flecha:hover { background: var(--tinta); color: var(--papel); }
    .flecha.previa { left: 1.25rem; }
    .flecha.siguiente { right: 1.25rem; }

    .cerrar { position: fixed; top: 1.25rem; right: 1.25rem; }

    .pista {
      position: fixed;
      left: 50%;
      bottom: 1.25rem;
      transform: translateX(-50%);
      font-size: 0.6875rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--tinta-suave);
      pointer-events: none;
    }

    /* =========================================================
       7. Pantallas chicas y movimiento reducido
       ========================================================= */
    @media (max-width: 700px) {
      /* En celular la grilla 2×2 no cabe: las secciones se apilan
         y la vista general vuelve a tener scroll. */
      body { overflow: auto; }
      .tablero { grid-template-columns: 1fr; grid-template-rows: none; }
      .seccion { min-height: 70vh; }
      .barra { padding: 1rem 1.125rem; }
      .flecha.previa { left: 0.5rem; }
      .flecha.siguiente { right: 0.5rem; }
      .pista { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; }
    }
  </style>
</head>

<body>

  <header class="barra">
    <h1>Archivo de prácticas</h1>
    <span class="estudiante">Camila Ferrada · Artes Visuales</span>

    <div class="acciones">
      <button type="button" class="boton" id="modo-seleccion">Seleccionar varios</button>
      <button type="button" class="boton" id="volver" hidden>← Vista general</button>
      <a class="boton fuerte" id="drive" href="#">Carpeta en Drive ↗</a>
    </div>
  </header>

  <main class="tablero" id="tablero"></main>

  <!-- Acciones del lote, visibles solo en modo selección -->
  <div class="lote" id="lote" hidden>
    <span class="lote-cuenta" id="lote-cuenta"></span>
    <div class="lote-destinos" id="lote-destinos"></div>
    <button type="button" class="boton" id="lote-limpiar">Limpiar</button>
    <button type="button" class="boton fuerte" id="lote-listo">Listo</button>
  </div>

  <!-- Obra en primer plano -->
  <div class="telon" id="telon" role="dialog" aria-modal="true" aria-label="Obra">
    <button type="button" class="flecha previa" id="previa" aria-label="Obra anterior">←</button>

    <div class="visor">
      <div class="visor-hueco" id="visor-hueco"></div>

      <div class="visor-datos">
        <span class="curso" id="visor-curso"></span>
        <span class="linea" id="visor-linea"></span>
        <span class="indice" id="visor-indice"></span>
      </div>

      <div class="enviar" id="enviar">
        <span class="enviar-rotulo">Enviar a</span>
      </div>
    </div>

    <button type="button" class="flecha siguiente" id="siguiente" aria-label="Obra siguiente">→</button>
    <button type="button" class="boton cerrar" id="cerrar">Cerrar ✕</button>
    <p class="pista">← → para moverse · Esc para cerrar</p>
  </div>

  <script>
    /* =========================================================
       1. Categorías
       Vienen definidas por la carrera. El estudiante no las crea
       ni las redefine: solo decide qué trabajos manda a cada una.
       ========================================================= */
    const CATEGORIAS = [
      {
        clave: "forma",
        titulo: "Forma y materiales",
        definicion: "Qué materia toca el trabajo y qué decisiones formales lo sostienen: " +
          "soportes, escalas, técnicas, texturas."
      },
      {
        clave: "nudo",
        titulo: "Nudo conceptual",
        definicion: "El problema que el trabajo mantiene abierto: la pregunta que vuelve, " +
          "aunque cambie el medio."
      },
      {
        clave: "modos",
        titulo: "Modos de hacer",
        definicion: "Cómo se produce el trabajo: procesos, rutinas de taller, " +
          "colaboraciones, maneras de resolver."
      }
    ];

    /* =========================================================
       2. Datos de prueba
       Cada obra es [línea, curso]. Ninguna nace clasificada: al
       abrir, las 40 están solo en "Todos los proyectos".
       ========================================================= */
    const CRUDO = [
      ["Talleres", "Taller de operaciones y procedimientos visuales"],
      ["Talleres", "Taller de operaciones y procedimientos visuales"],
      ["Talleres", "Taller de operaciones y procedimientos visuales"],
      ["Talleres", "Taller de prácticas artísticas I"],
      ["Talleres", "Taller de prácticas artísticas I"],
      ["Talleres", "Taller de prácticas artísticas I"],
      ["Talleres", "Taller de prácticas artísticas II"],
      ["Talleres", "Taller de prácticas artísticas II"],
      ["Estudios visuales", "Introducción a las vanguardias artísticas"],
      ["Estudios visuales", "Introducción a las vanguardias artísticas"],
      ["Estudios visuales", "Introducción al arte contemporáneo"],
      ["Estudios visuales", "Introducción al arte contemporáneo"],
      ["Estudios visuales", "Arte contemporáneo en Chile y Latinoamérica"],
      ["Estudios visuales", "Teoría de la imagen"],
      ["Estudios visuales", "Teoría de la imagen"],
      ["Lenguajes artísticos", "Dibujo y observación I"],
      ["Lenguajes artísticos", "Dibujo y observación I"],
      ["Lenguajes artísticos", "Dibujo y observación I"],
      ["Lenguajes artísticos", "Dibujo y observación II"],
      ["Lenguajes artísticos", "Dibujo y observación II"],
      ["Lenguajes artísticos", "Técnicas escultóricas"],
      ["Lenguajes artísticos", "Técnicas escultóricas"],
      ["Lenguajes artísticos", "Técnicas escultóricas"],
      ["Lenguajes artísticos", "Técnicas pictóricas"],
      ["Lenguajes artísticos", "Técnicas pictóricas"],
      ["Lenguajes artísticos", "Lenguajes escultóricos"],
      ["Lenguajes artísticos", "Lenguajes escultóricos"],
      ["Lenguajes artísticos", "Lenguajes pictóricos"],
      ["Lenguajes artísticos", "Lenguajes pictóricos"],
      ["Imagen y tecnología", "Medios gráficos"],
      ["Imagen y tecnología", "Medios gráficos"],
      ["Imagen y tecnología", "Medios digitales"],
      ["Imagen y tecnología", "Medios digitales"],
      ["Imagen y tecnología", "Imagen fija"],
      ["Imagen y tecnología", "Imagen fija"],
      ["Imagen y tecnología", "Imagen en movimiento"],
      ["Imagen y tecnología", "Imagen en movimiento"],
      ["Imagen y tecnología", "Imagen en movimiento"],
      ["Gestión", "Circuitos artísticos"],
      ["Gestión", "Circuitos artísticos"]
    ];

    const LINEAS = ["Talleres", "Estudios visuales", "Lenguajes artísticos",
                    "Imagen y tecnología", "Gestión"];

    // El número es lo único que distingue un rectángulo de otro
    // mientras no haya imágenes.
    const OBRAS = CRUDO.map(function (fila, i) {
      return {
        numero: String(i + 1).padStart(2, "0"),
        linea: fila[0],
        curso: fila[1],
        categorias: []
      };
    });

    /* Las cuatro secciones, en el orden de la grilla 2×2. La primera
       muestra todo en grilla; las otras tres son nodos en órbita. */
    const SECCIONES = [{
      titulo: "Todos los proyectos",
      clave: null,
      definicion: null
    }].concat(CATEGORIAS.map(function (categoria) {
      return {
        titulo: categoria.titulo,
        clave: categoria.clave,
        definicion: categoria.definicion
      };
    }));

    /* =========================================================
       3. Memoria del navegador
       No hay servidor: lo que se clasifica queda en el navegador
       para que sobreviva a una recarga durante la presentación.
       ========================================================= */
    function leerGuardado(llave, porDefecto) {
      try {
        const crudo = localStorage.getItem(llave);
        return crudo ? JSON.parse(crudo) : porDefecto;
      } catch (e) {
        return porDefecto;   // modo privado o almacenamiento bloqueado
      }
    }

    function guardarAsignaciones() {
      const mapa = {};
      OBRAS.forEach(function (obra) {
        if (obra.categorias.length > 0) mapa[obra.numero] = obra.categorias;
      });
      try {
        localStorage.setItem("asignaciones", JSON.stringify(mapa));
      } catch (e) { /* si no se puede guardar, igual se puede usar */ }
    }

    function cargarAsignaciones() {
      const guardadas = leerGuardado("asignaciones", {});
      OBRAS.forEach(function (obra) {
        obra.categorias = guardadas[obra.numero] || [];
      });
    }

    /* =========================================================
       4. Estado
       ========================================================= */
    const estado = {
      ampliada: null,     // índice de sección ampliada, o null en vista general
      lista: [],          // obras por las que navegan las flechas del visor
      obra: null,         // índice dentro de esa lista, o null si está cerrado
      seleccionando: false,
      seleccion: []       // números de las obras elegidas para el lote
    };

    const tablero = document.getElementById("tablero");
    const telon = document.getElementById("telon");
    const botonVolver = document.getElementById("volver");

    // Obras que le tocan a una sección.
    function obrasDe(seccion) {
      if (!seccion.clave) return OBRAS;
      return OBRAS.filter(function (obra) {
        return obra.categorias.indexOf(seccion.clave) !== -1;
      });
    }

    /* =========================================================
       5. Obras
       ========================================================= */
    function crearObra(obra, lista, indice) {
      const boton = document.createElement("button");
      boton.type = "button";
      boton.className = "obra";
      boton.textContent = obra.numero;
      boton.setAttribute("aria-label", "Proyecto " + obra.numero + ", " + obra.curso);

      // La misma obra puede tener ficha en varias secciones a la vez.
      boton.dataset.obra = obra.numero;
      if (estado.seleccionando && obraElegida(obra)) boton.classList.add("elegida");

      boton.addEventListener("click", function () {
        if (estado.seleccionando) alternarSeleccion(obra);
        else abrirObra(lista, indice);
      });

      if (obra.categorias.length > 0) {
        const marcas = document.createElement("div");
        marcas.className = "marcas";
        obra.categorias.forEach(function () { marcas.appendChild(document.createElement("i")); });
        boton.appendChild(marcas);
      }

      return boton;
    }

    function crearGrilla(lista) {
      const ul = document.createElement("ul");
      ul.className = "obras";

      lista.forEach(function (obra, i) {
        const celda = document.createElement("li");
        celda.appendChild(crearObra(obra, lista, i));
        ul.appendChild(celda);
      });

      return ul;
    }

    // La primera sección va agrupada por línea curricular.
    function crearPorLinea(lista) {
      const envoltura = document.createDocumentFragment();

      LINEAS.forEach(function (linea) {
        const deLaLinea = lista.filter(function (o) { return o.linea === linea; });
        if (deLaLinea.length === 0) return;

        const grupo = document.createElement("div");
        grupo.className = "grupo-linea";

        const rotulo = document.createElement("h3");
        rotulo.className = "rotulo-linea";
        rotulo.textContent = linea + " · " + deLaLinea.length;
        grupo.appendChild(rotulo);

        grupo.appendChild(crearGrilla(deLaLinea));
        envoltura.appendChild(grupo);
      });

      return envoltura;
    }

    /* =========================================================
       6. Reparto en anillos
       Toda la geometría de la órbita vive acá. El tamaño de ficha
       sale de la cantidad de obras y del radio disponible; si el
       anillo más externo no cabe, se achica la ficha y se vuelve
       a repartir. Por eso pocas obras salen grandes y muchas se
       acomodan en más anillos sin desbordarse.
       ========================================================= */
    const LADO_MINIMO = 22;
    const LADO_MAXIMO = 200;

    // Primer tanteo del tamaño. La raíz de la cantidad reparte el
    // área disponible: al doble de obras, cada una mide un 30% menos.
    function ladoDeTanteo(cantidad, radio) {
      const tanteo = 1.05 * radio / Math.sqrt(cantidad);
      return Math.max(LADO_MINIMO, Math.min(LADO_MAXIMO, tanteo));
    }

    // Cuántas fichas de este lado caben en una vuelta de este radio.
    function capacidadDelAnillo(radio, lado) {
      return Math.max(1, Math.floor((2 * Math.PI * radio) / (lado * 1.12)));
    }

    // Devuelve las posiciones relativas al centro y el radio externo.
    function repartirEnAnillos(cantidad, lado, radioInterior) {
      const posiciones = [];
      let radio = radioInterior + lado * 0.7;
      let colocadas = 0;
      let anillo = 0;

      while (colocadas < cantidad) {
        const enEste = Math.min(capacidadDelAnillo(radio, lado), cantidad - colocadas);

        // Cada anillo se gira medio paso: así las fichas no quedan
        // alineadas en radios y la mancha se ve más pareja.
        const giro = (anillo % 2) * (Math.PI / enEste);

        for (let i = 0; i < enEste; i++) {
          const angulo = giro + (i * 2 * Math.PI) / enEste - Math.PI / 2;
          posiciones.push({
            x: Math.cos(angulo) * radio,
            y: Math.sin(angulo) * radio
          });
        }

        colocadas += enEste;
        anillo++;
        if (colocadas < cantidad) radio += lado * 1.18;
      }

      return { posiciones: posiciones, radio: radio };
    }

    // Busca el lado más grande con el que todo cabe dentro del radio.
    function ajustarLado(cantidad, radioMaximo, radioInterior) {
      let lado = ladoDeTanteo(cantidad, radioMaximo);
      let reparto = repartirEnAnillos(cantidad, lado, radioInterior);
      let intentos = 0;

      while (reparto.radio + lado / 2 > radioMaximo &&
             lado > LADO_MINIMO && intentos < 40) {
        lado = Math.max(LADO_MINIMO, lado * 0.92);
        reparto = repartirEnAnillos(cantidad, lado, radioInterior);
        intentos++;
      }

      return { lado: lado, posiciones: reparto.posiciones };
    }

    // Coloca las fichas ya creadas. Se llama al dibujar y cada vez
    // que la sección cambia de tamaño.
    function acomodarOrbita(orbita) {
      const fichas = orbita.querySelectorAll(".orbitando");
      if (fichas.length === 0) return;

      const ancho = orbita.clientWidth;
      const alto = orbita.clientHeight;
      if (ancho === 0 || alto === 0) return;   // sección colapsada

      const nucleo = orbita.querySelector(".nucleo");
      const radioInterior = Math.max(nucleo.offsetWidth, nucleo.offsetHeight) / 2;
      const radioMaximo = Math.min(ancho, alto) / 2 - 6;

      const plan = ajustarLado(fichas.length, radioMaximo, radioInterior);

      fichas.forEach(function (ficha, i) {
        const punto = plan.posiciones[i];
        ficha.style.width = plan.lado + "px";
        ficha.style.left = (ancho / 2 + punto.x) + "px";
        ficha.style.top = (alto / 2 + punto.y) + "px";
        ficha.style.fontSize = Math.max(8, Math.round(plan.lado * 0.17)) + "px";
        ficha.classList.toggle("diminuta", plan.lado < 44);
      });
    }

    /* =========================================================
       7. Construcción de la pantalla
       ========================================================= */
    function crearNucleo(seccion, indice, cantidad) {
      const nucleo = document.createElement("div");
      nucleo.className = "nucleo";

      const titulo = document.createElement("button");
      titulo.type = "button";
      titulo.className = "titulo-nodo";
      titulo.innerHTML = seccion.titulo +
        '<br><span class="cuenta">' + cantidad + "</span>";
      titulo.addEventListener("click", function () { ampliar(indice); });
      nucleo.appendChild(titulo);

      const definicion = document.createElement("p");
      definicion.className = "definicion";
      definicion.textContent = seccion.definicion;
      nucleo.appendChild(definicion);

      if (cantidad === 0) {
        const vacio = document.createElement("p");
        vacio.className = "vacio-nodo";
        vacio.textContent = "Abre un proyecto desde «Todos los proyectos» " +
          "y mándalo a este nodo.";
        nucleo.appendChild(vacio);
      }

      return nucleo;
    }

    function crearOrbita(seccion, indice, lista) {
      const orbita = document.createElement("div");
      orbita.className = "orbita";
      orbita.appendChild(crearNucleo(seccion, indice, lista.length));

      lista.forEach(function (obra, i) {
        const ficha = crearObra(obra, lista, i);
        ficha.classList.add("orbitando");
        orbita.appendChild(ficha);
      });

      return orbita;
    }

    function crearSeccion(seccion, indice) {
      const nodo = document.createElement("section");
      nodo.className = "seccion";

      // Solo la primera lleva encabezado: en los nodos el título va
      // al centro de la órbita y es el que abre la sección.
      if (seccion.clave === null) {
        const cabecera = document.createElement("div");
        cabecera.className = "seccion-cabecera";

        const titulo = document.createElement("button");
        titulo.type = "button";
        titulo.className = "titulo-seccion";
        titulo.addEventListener("click", function () { ampliar(indice); });

        cabecera.appendChild(titulo);
        nodo.appendChild(cabecera);
        seccion.nodoTitulo = titulo;
      }

      const cuerpo = document.createElement("div");
      cuerpo.className = "seccion-cuerpo" + (seccion.clave ? " cuerpo-orbita" : "");
      nodo.appendChild(cuerpo);

      seccion.nodoCuerpo = cuerpo;
      return nodo;
    }

    function refrescarSeccion(seccion, indice) {
      const lista = obrasDe(seccion);
      seccion.nodoCuerpo.innerHTML = "";

      if (seccion.clave === null) {
        seccion.nodoTitulo.innerHTML = seccion.titulo +
          ' <span class="cuenta">' + lista.length + "</span>";
        seccion.nodoCuerpo.appendChild(crearPorLinea(lista));
        return;
      }

      const orbita = crearOrbita(seccion, indice, lista);
      seccion.nodoCuerpo.appendChild(orbita);
      acomodarOrbita(orbita);
    }

    function refrescar() {
      SECCIONES.forEach(refrescarSeccion);
    }

    function construir() {
      SECCIONES.forEach(function (seccion, i) {
        tablero.appendChild(crearSeccion(seccion, i));
      });
      refrescar();
      vigilarTamanos();
    }

    // La órbita depende del tamaño de la sección, y ese tamaño cambia
    // al ampliar y al mover la ventana. Se recalcula en cada cambio,
    // así la órbita se abre junto con la sección.
    function vigilarTamanos() {
      if (typeof ResizeObserver === "undefined") return;

      const vigia = new ResizeObserver(function (entradas) {
        entradas.forEach(function (entrada) {
          const orbita = entrada.target.querySelector(".orbita");
          if (orbita) acomodarOrbita(orbita);
        });
      });

      SECCIONES.forEach(function (seccion) {
        if (seccion.clave) vigia.observe(seccion.nodoCuerpo);
      });
    }

    /* =========================================================
       8. Las dos vistas
       No hay zoom gradual: la grilla pasa de 1fr 1fr a 1fr 0fr
       (o la combinación que toque) y la sección elegida crece en
       su lugar. Las otras se colapsan y se apagan.
       ========================================================= */
    const COLUMNAS = ["1fr 0fr", "0fr 1fr", "1fr 0fr", "0fr 1fr"];
    const FILAS    = ["1fr 0fr", "1fr 0fr", "0fr 1fr", "0fr 1fr"];

    function aplicarVista() {
      const ampliada = estado.ampliada;
      const hayAmpliada = ampliada !== null;

      tablero.style.gridTemplateColumns = hayAmpliada ? COLUMNAS[ampliada] : "1fr 1fr";
      tablero.style.gridTemplateRows = hayAmpliada ? FILAS[ampliada] : "1fr 1fr";
      tablero.classList.toggle("ampliada", hayAmpliada);

      Array.prototype.forEach.call(tablero.children, function (nodo, i) {
        nodo.classList.toggle("apagada", hayAmpliada && i !== ampliada);
      });

      botonVolver.hidden = !hayAmpliada;
    }

    function ampliar(indice) {
      estado.ampliada = indice;
      aplicarVista();
    }

    function volverAGeneral() {
      estado.ampliada = null;
      aplicarVista();
    }

    // En vista de sección, las flechas pasan a la sección contigua.
    function moverSeccion(paso) {
      if (estado.ampliada === null) return;
      const total = SECCIONES.length;
      ampliar((estado.ampliada + paso + total) % total);
    }

    /* =========================================================
       9. Obra en primer plano
       ========================================================= */
    function abrirObra(lista, indice) {
      estado.lista = lista;
      estado.obra = indice;
      pintarVisor();
      telon.classList.add("abierto");
      document.getElementById("cerrar").focus();
    }

    function cerrarObra() {
      estado.obra = null;
      telon.classList.remove("abierto");
    }

    // Las flechas pasan a la obra siguiente o anterior sin cerrar.
    function moverObra(paso) {
      if (estado.obra === null) return;
      const total = estado.lista.length;
      estado.obra = (estado.obra + paso + total) % total;
      pintarVisor();
    }

    // Manda o saca la obra de un nodo. Una obra puede estar en varios
    // a la vez, y sigue estando en "Todos los proyectos".
    function alternarCategoria(obra, clave) {
      const puesto = obra.categorias.indexOf(clave);
      if (puesto === -1) obra.categorias.push(clave);
      else obra.categorias.splice(puesto, 1);

      guardarAsignaciones();
      refrescar();
      pintarDestinos(obra);
    }

    function pintarDestinos(obra) {
      const zona = document.getElementById("enviar");
      zona.querySelectorAll(".destino").forEach(function (n) { n.remove(); });

      CATEGORIAS.forEach(function (categoria) {
        const boton = document.createElement("button");
        boton.type = "button";
        boton.className = "destino";
        boton.textContent = categoria.titulo;
        boton.setAttribute("aria-pressed",
          String(obra.categorias.indexOf(categoria.clave) !== -1));
        boton.addEventListener("click", function () {
          alternarCategoria(obra, categoria.clave);
        });
        zona.appendChild(boton);
      });
    }

    function pintarVisor() {
      const obra = estado.lista[estado.obra];

      document.getElementById("visor-hueco").textContent = obra.numero;
      document.getElementById("visor-curso").textContent = obra.curso;
      document.getElementById("visor-linea").textContent = obra.linea;
      document.getElementById("visor-indice").textContent =
        (estado.obra + 1) + " / " + estado.lista.length;

      pintarDestinos(obra);
    }

    /* =========================================================
       10. Selección múltiple
       Permite mandar varios trabajos a un nodo de una vez, sin
       tener que abrirlos uno por uno.
       ========================================================= */
    const lote = document.getElementById("lote");
    const loteCuenta = document.getElementById("lote-cuenta");
    const loteDestinos = document.getElementById("lote-destinos");
    const botonModo = document.getElementById("modo-seleccion");

    function obraElegida(obra) {
      return estado.seleccion.indexOf(obra.numero) !== -1;
    }

    function obrasSeleccionadas() {
      return OBRAS.filter(obraElegida);
    }

    // Todas las fichas de esa obra, estén en la sección que estén,
    // tienen que reflejar lo mismo.
    function marcarFichas(obra) {
      const elegida = obraElegida(obra);
      document.querySelectorAll('[data-obra="' + obra.numero + '"]')
        .forEach(function (ficha) { ficha.classList.toggle("elegida", elegida); });
    }

    function alternarSeleccion(obra) {
      const puesto = estado.seleccion.indexOf(obra.numero);
      if (puesto === -1) estado.seleccion.push(obra.numero);
      else estado.seleccion.splice(puesto, 1);

      marcarFichas(obra);
      pintarLote();
    }

    // Cuántas del lote ya están en esa categoría.
    function cuantasEn(lista, clave) {
      return lista.filter(function (obra) {
        return obra.categorias.indexOf(clave) !== -1;
      }).length;
    }

    // Si todas están, el botón las saca; si no, las agrega todas.
    // Así el mismo botón sirve para mandar y para deshacer.
    function aplicarALote(clave) {
      const lista = obrasSeleccionadas();
      if (lista.length === 0) return;

      const quitar = cuantasEn(lista, clave) === lista.length;

      lista.forEach(function (obra) {
        const puesto = obra.categorias.indexOf(clave);
        if (quitar && puesto !== -1) obra.categorias.splice(puesto, 1);
        if (!quitar && puesto === -1) obra.categorias.push(clave);
      });

      guardarAsignaciones();
      refrescar();
      pintarLote();
    }

    function pintarLote() {
      const lista = obrasSeleccionadas();

      loteCuenta.textContent = lista.length === 0
        ? "Elige uno o más trabajos"
        : lista.length + " seleccionado(s)";

      loteDestinos.innerHTML = "";

      CATEGORIAS.forEach(function (categoria) {
        const dentro = cuantasEn(lista, categoria.clave);
        const todas = lista.length > 0 && dentro === lista.length;
        const algunas = dentro > 0 && !todas;

        const boton = document.createElement("button");
        boton.type = "button";
        boton.className = "destino" + (algunas ? " parcial" : "");
        boton.textContent = categoria.titulo +
          (algunas ? " · " + dentro + "/" + lista.length : "");
        boton.setAttribute("aria-pressed", String(todas));
        boton.disabled = lista.length === 0;
        boton.addEventListener("click", function () { aplicarALote(categoria.clave); });
        loteDestinos.appendChild(boton);
      });
    }

    function entrarASeleccion() {
      estado.seleccionando = true;
      document.body.classList.add("seleccionando");
      botonModo.textContent = "Cancelar selección";
      lote.hidden = false;
      pintarLote();
    }

    function salirDeSeleccion() {
      estado.seleccionando = false;
      estado.seleccion = [];
      document.body.classList.remove("seleccionando");
      botonModo.textContent = "Seleccionar varios";
      lote.hidden = true;
      refrescar();   // repinta las fichas sin la marca de elegidas
    }

    function limpiarSeleccion() {
      estado.seleccion = [];
      refrescar();
      pintarLote();
    }

    /* =========================================================
       11. Teclado y escuchas
       Con una obra abierta las flechas mueven obras; si no, y hay
       una sección ampliada, mueven secciones.
       ========================================================= */
    document.addEventListener("keydown", function (evento) {
      const enVisor = estado.obra !== null;

      if (evento.key === "Escape") {
        if (enVisor) cerrarObra();
        else if (estado.seleccionando) salirDeSeleccion();
        else volverAGeneral();
        return;
      }

      if (evento.key === "ArrowLeft" || evento.key === "ArrowRight") {
        const paso = evento.key === "ArrowRight" ? 1 : -1;
        if (enVisor) moverObra(paso);
        else moverSeccion(paso);
        evento.preventDefault();
      }
    });

    telon.addEventListener("click", function (evento) {
      // Clic en el fondo atenuado, fuera del visor: cierra.
      if (evento.target === telon) cerrarObra();
    });

    document.getElementById("previa").addEventListener("click", function () { moverObra(-1); });
    document.getElementById("siguiente").addEventListener("click", function () { moverObra(1); });
    document.getElementById("cerrar").addEventListener("click", cerrarObra);
    botonVolver.addEventListener("click", volverAGeneral);

    botonModo.addEventListener("click", function () {
      if (estado.seleccionando) salirDeSeleccion();
      else entrarASeleccion();
    });

    document.getElementById("lote-limpiar").addEventListener("click", limpiarSeleccion);
    document.getElementById("lote-listo").addEventListener("click", salirDeSeleccion);

    cargarAsignaciones();
    construir();
    aplicarVista();
  </script>

</body>

</html>
