  /* ---------- Base ---------- */
  :root {
    --fondo: #ffffff;
    --lista: #e9e9e9;
    --bloque: rgba(0, 0, 0, 0.03);
    --hueco: #d9d9d9;
    --ficha: #eeeeee;
    --ficha-borde: rgba(0, 0, 0, 0.37);
    --tinta: #000000;
    --tinta-media: #555555;
    --tinta-suave: #8a8a8a;
    --radio: 5px;

    --ancho-lista: clamp(320px, 35vw, 607px);
    --paso: 0.6s;
    --curva: cubic-bezier(0.4, 0, 0.2, 1);

    --fuente: 'WorkSans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--fondo);
    color: var(--tinta);
    font-family: var(--fuente);
    -webkit-font-smoothing: antialiased;
  }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }

  :focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; }

  [hidden] { display: none !important; }

  /* ---------- Lista lateral ----------
     Se desliza desde la izquierda y empuja al escenario. */
  .lista {
    position: fixed;
    inset: 0 auto 0 0;
    width: var(--ancho-lista);
    background: var(--lista);
    overflow-y: auto;
    padding: 55px 20px 40px;
    transform: translateX(-100%);
    transition: transform var(--paso) var(--curva);
    z-index: 5;
  }

  .con-lista .lista { transform: none; }

  .lista-cabeza {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin: 0 0 22px;
    padding: 0 23px;
  }

  .lista-cabeza h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 500;
  }

  .lista-cabeza a {
    font-size: 13px;
    color: var(--tinta-media);
    text-decoration: none;
    white-space: nowrap;
  }

  .lista-cabeza a:hover { color: var(--tinta); text-decoration: underline; }

  .curso {
    background: var(--bloque);
    padding: 23px;
    margin-bottom: 22px;
  }

  .curso h2 {
    margin: 0;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.3;
  }

  .curso-datos {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--tinta-suave);
  }

  .curso-obras {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px 0 0;
    margin-top: 10px;
  }

  /* Miniatura cuadrada de la lista */
  .mini {
    position: relative;
    width: 80px;
    height: 80px;
    flex: none;
    background: var(--hueco);
    overflow: hidden;
    cursor: grab;
    transition: transform 0.15s var(--curva), box-shadow 0.15s var(--curva);
  }

  .mini:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12); }
  .mini:active { cursor: grabbing; }
  .mini.arrastrando { opacity: 0.35; }

  .mini img,
  .ficha img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  /* En qué nodos está: una inicial por nodo, abajo a la derecha */
  .marcas {
    position: absolute;
    right: 4px;
    bottom: 4px;
    display: flex;
    gap: 2px;
    pointer-events: none;
  }

  .marcas span {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--tinta);
    color: #fff;
    font-size: 9px;
    line-height: 15px;
    text-align: center;
  }

  .lista-vacia {
    padding: 0 23px;
    font-size: 14px;
    color: var(--tinta-media);
    line-height: 1.5;
  }

  /* Texto: un papel con el comienzo del texto */
  .extracto {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 8%;
    background: #fafafa;
    font-size: 8px;
    line-height: 1.35;
    color: var(--tinta-media);
    overflow: hidden;
    text-align: left;
    pointer-events: none;
  }

  /* Marca de reproducción sobre los videos */
  .marca-video {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 26%;
    aspect-ratio: 1;
    min-width: 14px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    pointer-events: none;
  }

  .marca-video::after {
    content: "";
    position: absolute;
    left: 40%;
    top: 30%;
    border-style: solid;
    border-width: 0.25em 0 0.25em 0.42em;
    border-color: transparent transparent transparent #fff;
    font-size: clamp(8px, 1.4vw, 22px);
  }

  /* ---------- Escenario ---------- */
  .escenario {
    position: fixed;
    inset: 0 0 0 0;
    transition: left var(--paso) var(--curva);
  }

  .con-lista .escenario { left: var(--ancho-lista); }

  .menu {
    position: absolute;
    left: 21px;
    top: 13px;
    width: 64px;
    height: 56px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 13px;
    padding: 0 6px;
    z-index: 4;
  }

  .menu span {
    display: block;
    height: 1px;
    background: var(--tinta);
    transition: transform 0.3s var(--curva), opacity 0.3s var(--curva);
  }

  .con-lista .menu span:nth-child(1) { transform: translateY(14px) rotate(45deg); }
  .con-lista .menu span:nth-child(2) { opacity: 0; }
  .con-lista .menu span:nth-child(3) { transform: translateY(-14px) rotate(-45deg); }

  .volver {
    position: absolute;
    left: 96px;
    top: 26px;
    font-size: 14px;
    color: var(--tinta-media);
    padding: 6px 10px;
    border-radius: 999px;
    z-index: 4;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s var(--curva);
  }

  .ampliado .volver { opacity: 1; pointer-events: auto; }
  .volver:hover { color: var(--tinta); background: rgba(0, 0, 0, 0.05); }

  .estado-guardado {
    position: absolute;
    right: 24px;
    top: 30px;
    font-size: 13px;
    color: var(--tinta-suave);
    z-index: 4;
  }

  .estado-guardado.falla { color: var(--tinta); font-weight: 600; }

  .pista {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 22px;
    margin: 0;
    text-align: center;
    font-size: 13px;
    color: var(--tinta-suave);
    pointer-events: none;
    z-index: 4;
    padding: 0 16px;
  }

  /* ---------- Nodos ----------
     Cada nodo es un cuadrado que el script ubica y dimensiona. Todo lo de
     adentro va en proporción al nodo, así el mismo nodo sirve de chico en
     la vista general y de grande en la ampliada, y la transición entre
     las dos sale sola. */
  .nodo {
    position: absolute;
    container-type: size;
    transition:
      left var(--paso) var(--curva),
      top var(--paso) var(--curva),
      width var(--paso) var(--curva),
      height var(--paso) var(--curva),
      opacity var(--paso) var(--curva);
  }

  .nodo.fuera { opacity: 0; pointer-events: none; }

  /* El halo: centro blanco, anillo gris difuso, borde que se disuelve.
     Son los mismos cortes del degradado del Figma. */
  .aura {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle closest-side,
      rgba(217, 217, 217, 0) 30%,
      rgba(30, 30, 30, 0.4) 60%,
      rgba(30, 30, 30, 0.4) 70%,
      rgba(0, 0, 0, 0) 90%);
    transition: transform 0.35s var(--curva), filter 0.35s var(--curva);
    pointer-events: none;
  }

  .nodo.sobre .aura { transform: scale(1.06); filter: brightness(0.8); }

  /* El centro blanco es el que se toca para ampliar */
  .rotulo {
    position: absolute;
    left: 25%;
    top: 25%;
    width: 50%;
    height: 50%;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    text-transform: uppercase;
    font-size: clamp(10px, 3.1cqw, 34px);
    line-height: 1.2;
    letter-spacing: 0.02em;
    padding: 0 4%;
  }

  .rotulo:focus-visible { outline-offset: -6px; }

  .rotulo .cuenta {
    margin-top: 0.5em;
    font-size: 0.55em;
    letter-spacing: 0.08em;
    color: var(--tinta-suave);
  }

  .rotulo .definicion {
    margin-top: 0.8em;
    max-width: 22em;
    font-size: 0.45em;
    line-height: 1.45;
    text-transform: none;
    letter-spacing: 0;
    color: var(--tinta-media);
  }

  .nodo:not(.grande) .definicion { display: none; }

  /* Ficha en órbita: el script le da centro y tamaño en % del nodo */
  .ficha {
    position: absolute;
    transform: translate(-50%, -50%);
    background: var(--ficha);
    border: 1px solid var(--ficha-borde);
    border-radius: var(--radio);
    overflow: hidden;
    cursor: grab;
    transition:
      left var(--paso) var(--curva),
      top var(--paso) var(--curva),
      width var(--paso) var(--curva),
      height var(--paso) var(--curva),
      opacity 0.4s var(--curva),
      box-shadow 0.2s var(--curva);
  }

  /* !important: el orden en la órbita va como z-index en línea */
  .ficha:hover, .ficha:focus-visible { box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18); z-index: 500 !important; }
  .ficha:active { cursor: grabbing; }
  .ficha.naciendo { opacity: 0; }
  .ficha.arrastrando { opacity: 0.3; }
  .ficha .extracto { font-size: clamp(3px, 1.1cqw, 13px); }

  /* ---------- Visor ---------- */
  .visor {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(255, 255, 255, 0.97);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 72px 88px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s var(--curva);
  }

  .visor.abierto { opacity: 1; pointer-events: auto; }

  .visor-caja {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 260px;
    gap: 40px;
    width: 100%;
    max-width: 1300px;
    height: 100%;
  }

  .visor-medio {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }

  .visor-medio img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: var(--radio);
  }

  .visor-medio iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    max-height: 100%;
    border: 0;
    border-radius: var(--radio);
    background: #000;
  }

  .visor-texto {
    max-width: 62ch;
    max-height: 100%;
    overflow-y: auto;
    background: #fafafa;
    border: 1px solid var(--ficha-borde);
    border-radius: var(--radio);
    padding: 40px 44px;
    font-size: 17px;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .visor-hueco {
    width: min(100%, 520px);
    aspect-ratio: 4 / 3;
    background: var(--ficha);
    border: 1px solid var(--ficha-borde);
    border-radius: var(--radio);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--tinta-suave);
    font-size: 14px;
  }

  .visor-datos {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    min-width: 0;
  }

  .visor-curso { font-size: 18px; line-height: 1.3; }
  .visor-linea, .visor-indice { font-size: 13px; color: var(--tinta-suave); }
  .visor-archivo { font-size: 12px; color: var(--tinta-suave); word-break: break-all; }

  .visor-nodos {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 28px;
  }

  .visor-botones { display: flex; flex-direction: column; gap: 4px; }

  .visor-nodos-rotulo { font-size: 13px; color: var(--tinta-media); }

  /* Botón de nodo: un círculo chico con el mismo halo */
  .alternar {
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    font-size: 14px;
    padding: 4px 0;
    color: var(--tinta-media);
  }

  .alternar::before {
    content: "";
    width: 34px;
    height: 34px;
    flex: none;
    border-radius: 50%;
    background: radial-gradient(circle closest-side,
      rgba(217, 217, 217, 0) 30%, rgba(30, 30, 30, 0.4) 60%,
      rgba(30, 30, 30, 0.4) 70%, rgba(0, 0, 0, 0) 90%);
    opacity: 0.35;
    transition: opacity 0.2s var(--curva), transform 0.2s var(--curva);
  }

  .alternar:hover::before { opacity: 0.6; }
  .alternar[aria-pressed="true"] { color: var(--tinta); }
  .alternar[aria-pressed="true"]::before { opacity: 1; transform: scale(1.12); }

  .flecha,
  .cerrar {
    position: absolute;
    font-size: 22px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    color: var(--tinta-media);
  }

  .flecha:hover, .cerrar:hover { color: var(--tinta); background: rgba(0, 0, 0, 0.05); }
  .flecha { top: 50%; transform: translateY(-50%); }
  .previa { left: 20px; }
  .siguiente { right: 20px; }
  .cerrar { top: 16px; right: 20px; font-size: 18px; }

  /* ---------- Aviso ---------- */
  .aviso {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 24px;
    background: var(--fondo);
    text-align: center;
  }

  .aviso p { margin: 0; max-width: 46ch; line-height: 1.5; }
  .aviso-titulo { font-size: 20px; }
  .aviso-texto { color: var(--tinta-media); }

  .demo {
    position: fixed;
    right: 24px;
    top: 30px;
    margin: 0;
    z-index: 6;
    font-size: 12px;
    color: var(--tinta-suave);
  }

  /* ---------- Pantallas angostas ----------
     La lista tapa el escenario en vez de empujarlo: no hay ancho para las
     dos cosas. Se clasifica desde el visor. */
  @media (max-width: 700px) {
    :root { --ancho-lista: 100vw; }
    .con-lista .escenario { left: 0; }
    .con-lista .menu { position: fixed; z-index: 8; }
    .lista { padding-top: 76px; padding-left: 12px; padding-right: 12px; }
    .curso { padding: 16px; }
    .mini { width: 72px; height: 72px; }
    .visor { padding: 64px 16px 72px; }
    .visor-caja { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; gap: 20px; }
    .visor-nodos { margin-top: 12px; }
    .visor-botones { flex-direction: row; flex-wrap: wrap; gap: 4px 16px; }
    .flecha { top: auto; bottom: 12px; transform: none; }
    .volver { left: 84px; }
  }

  @media (prefers-reduced-motion: reduce) {
    :root { --paso: 0.01s; }
  }
</style>

<body>

  <aside class="lista" id="lista" aria-label="Mis trabajos por curso">
    <div class="lista-cabeza">
      <h1 id="estudiante">Mis trabajos</h1>
      <a id="drive" href="#" target="_blank" rel="noopener" hidden>Mi carpeta en Drive ↗</a>
    </div>
    <div id="cursos"></div>
  </aside>

  <main class="escenario" id="escenario">
    <button type="button" class="menu" id="menu" aria-controls="lista" aria-expanded="false"
      aria-label="Mostrar mis trabajos"><span></span><span></span><span></span></button>

    <button type="button" class="volver" id="volver">← Todos los nodos</button>

    <span class="estado-guardado" id="guardado" aria-live="polite"></span>

    <div id="nodos"></div>

    <p class="pista" id="pista"></p>
  </main>

  <!-- Trabajo en primer plano -->
  <div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Trabajo">
    <div class="visor-caja">
      <div class="visor-medio" id="visor-medio"></div>

      <div class="visor-datos">
        <span class="visor-curso" id="visor-curso"></span>
        <span class="visor-linea" id="visor-linea"></span>
        <span class="visor-archivo" id="visor-archivo"></span>
        <span class="visor-indice" id="visor-indice"></span>

        <div class="visor-nodos">
          <span class="visor-nodos-rotulo">Está en</span>
          <div id="visor-alternar" class="visor-botones"></div>
        </div>
      </div>
    </div>

    <button type="button" class="flecha previa" id="previa" aria-label="Trabajo anterior">←</button>
    <button type="button" class="flecha siguiente" id="siguiente" aria-label="Trabajo siguiente">→</button>
    <button type="button" class="cerrar" id="cerrar" aria-label="Cerrar">✕</button>
  </div>

  <!-- Cuando no se pudo identificar la cuenta o no hay nada subido -->
  <div class="aviso" id="aviso" hidden>
    <p class="aviso-titulo" id="aviso-titulo"></p>
    <p class="aviso-texto" id="aviso-texto"></p>
  </div>

  <p class="demo" id="demo" hidden>Vista de ejemplo · se abre desde Apps Script para ver tus trabajos</p>

  <!-- Apps Script reemplaza esto por los datos. Abriendo el archivo suelto
       este bloque falla solo, y la página arma datos de ejemplo. -->
  <script>const DATOS = <?!= datosJson ?>;</script>

<script>
/* =========================================================
   1. Datos
   ========================================================= */
const EN_APPS_SCRIPT = typeof DATOS !== "undefined";
const ARCHIVO = EN_APPS_SCRIPT ? DATOS : datosDeEjemplo();

const CATEGORIAS = ARCHIVO.categorias || [];
const OBRAS = ordenarPorCurso(ARCHIVO.obras || [], ARCHIVO.lineas || []);

// La clasificación guardada se cuelga de cada trabajo.
OBRAS.forEach(function (obra) {
    const guardadas = (ARCHIVO.clasificacion && ARCHIVO.clasificacion[obra.id]) || [];
    obra.categorias = guardadas.filter(function (clave) { return categoria(clave); });
});

function categoria(clave) {
    return CATEGORIAS.find(function (c) { return c.clave === clave; });
}

function obra(id) {
    return OBRAS.find(function (o) { return o.id === id; });
}

function obrasDelNodo(clave) {
    return OBRAS.filter(function (o) { return o.categorias.indexOf(clave) !== -1; });
}

// Cursos en el orden de la malla; los que no están en ella, al final y en
// el orden en que aparecen.
function ordenarPorCurso(obras, lineas) {
    const orden = {};
    let n = 0;
    lineas.forEach(function (linea) {
        linea.cursos.forEach(function (curso) {
            orden[curso.nombre.toLowerCase()] = { i: n++, semestre: curso.semestre };
        });
    });

    obras.forEach(function (o, i) {
        const lugar = orden[String(o.curso).toLowerCase()];
        o.ordenCurso = lugar ? lugar.i : 1000 + i;
        o.semestre = lugar ? lugar.semestre : "";
        o.ordenPropio = i;
    });

    return obras.slice().sort(function (a, b) {
        return (a.ordenCurso - b.ordenCurso) || (a.ordenPropio - b.ordenPropio);
    });
}

/* =========================================================
   2. Imágenes desde Drive
   Drive tiene dos formas de servir una miniatura y no siempre
   funcionan las mismas: googleusercontent suele pasar donde
   drive.google.com da 403, sobre todo dentro del iframe de Apps
   Script. Se prueban en orden.
   ========================================================= */
function urlesDeMiniatura(o, ancho) {
    if (o.tipo === "youtube") {
        // La portada de YouTube es pública: no depende de permisos de
        // Drive y por eso es la que conviene primero.
        const deYoutube = "https://img.youtube.com/vi/" + o.idVideo + "/hqdefault.jpg";

        // Si además se guardó la portada en Drive, sirve de respaldo.
        if (o.portada && o.archivo.slice(-4).toLowerCase() === ".jpg") {
            return [deYoutube].concat(urlesDeDrive(o.portada, ancho));
        }
        return [deYoutube];
    }

    return o.id && !o.ejemplo ? urlesDeDrive(o.id, ancho) : [];
}

function urlesDeDrive(id, ancho) {
    return [
        "https://lh3.googleusercontent.com/d/" + id + "=w" + ancho,
        "https://drive.google.com/thumbnail?id=" + id + "&sz=w" + ancho
    ];
}

// Los videos de Drive no tienen URL directa reproducible: se usa su
// reproductor. Los de YouTube van por el dominio sin cookies.
function urlReproductor(o) {
    if (o.tipo === "youtube") return "https://www.youtube-nocookie.com/embed/" + o.idVideo;
    return "https://drive.google.com/file/d/" + o.id + "/preview";
}

function crearImagen(o, ancho) {
    const urles = urlesDeMiniatura(o, ancho);
    if (urles.length === 0) return null;

    // Si ya se sabe cuál de las formas funciona, se parte por esa.
    let intento = Math.min(o.urlQueSirve || 0, urles.length - 1);

    const imagen = document.createElement("img");
    imagen.alt = "";
    imagen.loading = "lazy";
    imagen.draggable = false;

    // Sin esto Google ve que la petición viene del iframe de Apps Script
    // y responde 403 a las imágenes que no son públicas.
    imagen.referrerPolicy = "no-referrer";

    imagen.addEventListener("load", function () {
        o.urlQueSirve = intento;
        // La proporción real da la forma de la ficha en la órbita.
        if (!o.proporcion && imagen.naturalWidth && imagen.naturalHeight) {
            o.proporcion = imagen.naturalWidth / imagen.naturalHeight;
            redimensionarFichas(o);
        }
    });

    // Si se acaban las formas, se quita la imagen y queda el rectángulo
    // gris: la ficha sigue sirviendo, solo que sin vista previa.
    imagen.addEventListener("error", function () {
        intento++;
        if (intento < urles.length) imagen.src = urles[intento];
        else imagen.remove();
    });

    imagen.src = urles[intento];
    return imagen;
}

// Lo que va dentro de una miniatura o ficha, según el tipo.
function contenidoDe(o, ancho) {
    if (o.tipo === "texto") {
        const extracto = document.createElement("p");
        extracto.className = "extracto";
        extracto.textContent = o.contenido.slice(0, 400);
        return [extracto];
    }

    const partes = [];
    const imagen = crearImagen(o, ancho);
    if (imagen) partes.push(imagen);

    if (o.tipo === "video" || o.tipo === "youtube") {
        const marca = document.createElement("span");
        marca.className = "marca-video";
        partes.push(marca);
    }
    return partes;
}

/* =========================================================
   3. Estado
   ========================================================= */
const estado = {
    listaAbierta: false,
    ampliado: null,        // clave del nodo ampliado, o null en la vista general
    arrastre: null,        // { id, desde } mientras se arrastra un trabajo
    visor: null            // { lista, i } con el visor abierto
};

const cuerpo = document.body;
const escenario = document.getElementById("escenario");
const capaNodos = document.getElementById("nodos");
const lista = document.getElementById("lista");

/* =========================================================
   4. Guardado
   No se llama al servidor en cada cambio: se junta lo que pasó
   en casi un segundo y se manda el mapa completo de una vez.
   ========================================================= */
let temporizador = null;

function mapaDeClasificacion() {
    const mapa = {};
    OBRAS.forEach(function (o) {
        if (o.categorias.length > 0) mapa[o.id] = o.categorias;
    });
    return mapa;
}

function mostrarGuardado(texto, falla) {
    const aviso = document.getElementById("guardado");
    aviso.textContent = texto;
    aviso.classList.toggle("falla", !!falla);
}

function programarGuardado() {
    if (!EN_APPS_SCRIPT) return;
    mostrarGuardado("Guardando…");
    clearTimeout(temporizador);
    temporizador = setTimeout(guardar, 800);
}

function guardar() {
    google.script.run
        .withSuccessHandler(function (respuesta) {
            if (respuesta && respuesta.exito) mostrarGuardado("Guardado");
            else mostrarGuardado("No se pudo guardar", true);
        })
        .withFailureHandler(function () {
            mostrarGuardado("No se pudo guardar", true);
        })
        .guardarClasificacion(mapaDeClasificacion());
}

// Si se cierra la pestaña con un guardado pendiente, se manda ya.
window.addEventListener("pagehide", function () {
    if (temporizador && EN_APPS_SCRIPT) { clearTimeout(temporizador); guardar(); }
});

/* =========================================================
   5. Cambiar la clasificación
   Todo cambio pasa por acá, para que la lista, los nodos y el
   visor queden siempre al día.
   ========================================================= */
function poner(o, clave) {
    if (o.categorias.indexOf(clave) !== -1) return;
    o.categorias.push(clave);
    alCambiar();
}

function quitar(o, clave) {
    const i = o.categorias.indexOf(clave);
    if (i === -1) return;
    o.categorias.splice(i, 1);
    alCambiar();
}

function alCambiar() {
    actualizarMarcas();
    dibujarOrbitas();
    actualizarPista();
    if (estado.visor) pintarAlternar();
    programarGuardado();
}

/* =========================================================
   6. Lista lateral
   ========================================================= */
function crearLista() {
    const contenedor = document.getElementById("cursos");
    contenedor.innerHTML = "";

    if (OBRAS.length === 0) {
        const vacio = document.createElement("p");
        vacio.className = "lista-vacia";
        vacio.textContent = "Todavía no tienes trabajos subidos. Súbelos desde el formulario y vuelve acá.";
        contenedor.appendChild(vacio);
        return;
    }

    // Un bloque por curso, en el orden que ya traen las obras.
    let bloque = null;
    let cursoActual = null;

    OBRAS.forEach(function (o) {
        if (o.curso !== cursoActual) {
            cursoActual = o.curso;
            bloque = crearBloque(o);
            contenedor.appendChild(bloque.seccion);
        }
        bloque.obras.appendChild(crearMini(o));
        bloque.cuenta++;
        bloque.datos.textContent = [o.linea, o.semestre, bloque.cuenta +
            (bloque.cuenta === 1 ? " trabajo" : " trabajos")].filter(Boolean).join(" · ");
    });
}

function crearBloque(o) {
    const seccion = document.createElement("section");
    seccion.className = "curso";

    const titulo = document.createElement("h2");
    titulo.textContent = o.curso || "Sin curso";

    const datos = document.createElement("p");
    datos.className = "curso-datos";

    const obras = document.createElement("div");
    obras.className = "curso-obras";

    seccion.append(titulo, datos, obras);
    return { seccion: seccion, datos: datos, obras: obras, cuenta: 0 };
}

function crearMini(o) {
    const mini = crearTocable("mini");
    mini.dataset.obra = o.id;
    mini.setAttribute("aria-label", nombreDe(o));

    contenidoDe(o, 200).forEach(function (parte) { mini.appendChild(parte); });

    const marcas = document.createElement("span");
    marcas.className = "marcas";
    mini.appendChild(marcas);

    hacerArrastrable(mini, o, null);
    mini.addEventListener("click", function () { abrirVisor(OBRAS, OBRAS.indexOf(o)); });
    return mini;
}

// Una inicial por nodo en el que está el trabajo.
function actualizarMarcas() {
    document.querySelectorAll(".mini").forEach(function (mini) {
        const o = obra(mini.dataset.obra);
        const marcas = mini.querySelector(".marcas");
        marcas.innerHTML = "";
        o.categorias.forEach(function (clave) {
            const marca = document.createElement("span");
            marca.textContent = categoria(clave).titulo.charAt(0);
            marca.title = categoria(clave).titulo;
            marcas.appendChild(marca);
        });
    });
}

// Un div que se comporta como botón. No es un <button> porque Firefox no
// deja arrastrar botones.
function crearTocable(clase) {
    const elemento = document.createElement("div");
    elemento.className = clase;
    elemento.tabIndex = 0;
    elemento.setAttribute("role", "button");
    elemento.addEventListener("keydown", function (evento) {
        if (evento.key === "Enter" || evento.key === " ") {
            evento.preventDefault();
            elemento.click();
        }
    });
    return elemento;
}

function nombreDe(o) {
    const tipo = { imagen: "Imagen", texto: "Texto", youtube: "Video", video: "Video" }[o.tipo] || "Trabajo";
    return tipo + " de " + (o.curso || "sin curso");
}

function alternarLista(abrir) {
    estado.listaAbierta = typeof abrir === "boolean" ? abrir : !estado.listaAbierta;
    cuerpo.classList.toggle("con-lista", estado.listaAbierta);

    const menu = document.getElementById("menu");
    menu.setAttribute("aria-expanded", String(estado.listaAbierta));
    menu.setAttribute("aria-label", estado.listaAbierta ? "Ocultar mis trabajos" : "Mostrar mis trabajos");

    disponerNodos();
    actualizarPista();
}

/* =========================================================
   7. Nodos
   ========================================================= */
const nodos = {};   // clave -> { raiz, capa, fichas: Map(id -> elemento) }

function crearNodos() {
    CATEGORIAS.forEach(function (c) {
        const raiz = document.createElement("div");
        raiz.className = "nodo";
        raiz.dataset.clave = c.clave;

        const aura = document.createElement("div");
        aura.className = "aura";

        const capa = document.createElement("div");

        const rotulo = document.createElement("button");
        rotulo.type = "button";
        rotulo.className = "rotulo";

        const titulo = document.createElement("span");
        titulo.textContent = c.titulo;
        const cuenta = document.createElement("span");
        cuenta.className = "cuenta";
        rotulo.append(titulo, cuenta);

        if (c.definicion) {
            const definicion = document.createElement("span");
            definicion.className = "definicion";
            definicion.textContent = c.definicion;
            rotulo.appendChild(definicion);
        }

        rotulo.addEventListener("click", function () {
            ampliar(estado.ampliado === c.clave ? null : c.clave);
        });

        raiz.append(aura, rotulo, capa);
        capaNodos.appendChild(raiz);

        recibirArrastre(raiz, c.clave);
        nodos[c.clave] = { raiz: raiz, capa: capa, cuenta: cuenta, fichas: new Map() };
    });
}

// Ubica los nodos según el espacio disponible. Se calcula con el ancho
// final del escenario, no el de este momento: si la lista se está
// abriendo, el escenario todavía no terminó de achicarse.
function disponerNodos() {
    const angosta = window.matchMedia("(max-width: 700px)").matches;
    const W = document.documentElement.clientWidth - (estado.listaAbierta && !angosta ? lista.offsetWidth : 0);
    const H = document.documentElement.clientHeight;
    const cx = W / 2;
    const cy = H / 2;
    const claves = CATEGORIAS.map(function (c) { return c.clave; });

    cuerpo.classList.toggle("ampliado", !!estado.ampliado);

    claves.forEach(function (clave, i) {
        let x, y, d, fuera = false, grande = false;

        if (estado.ampliado) {
            // El ampliado al centro; los otros se recogen en él y se apagan.
            const D = Math.min(W * 0.84, H * 0.8);
            x = cx; y = cy + 10;
            d = clave === estado.ampliado ? D : D * 0.3;
            fuera = clave !== estado.ampliado;
            grande = !fuera;

        } else if (W / H < 0.8) {
            // Pantalla vertical: los tres en columna.
            const D = Math.min(W * 0.62, (H - 40) / 3.35);
            x = cx; y = cy + (i - 1) * D * 1.1;
            d = D;

        } else {
            // Triángulo: uno arriba al centro y dos abajo, como en el Figma.
            // Los factores dejan lugar para las fichas, que salen del círculo.
            const D = Math.min(W / 2.45, H / 2.2);
            const posiciones = [[0, -0.5], [-0.6, 0.5], [0.6, 0.5]];
            const p = posiciones[i] || [0, 0];
            x = cx + p[0] * D; y = cy + p[1] * D;
            d = D;
        }

        const raiz = nodos[clave].raiz;
        raiz.style.left = (x - d / 2) + "px";
        raiz.style.top = (y - d / 2) + "px";
        raiz.style.width = d + "px";
        raiz.style.height = d + "px";
        raiz.classList.toggle("fuera", fuera);
        raiz.classList.toggle("grande", grande);
        raiz.querySelector(".rotulo").setAttribute("aria-label",
            categoria(clave).titulo + (grande ? ", volver a los tres nodos" : ", ampliar"));
    });
}

function ampliar(clave) {
    estado.ampliado = clave;
    disponerNodos();
}

// Un número entre 0 y 1 que depende solo del id: la órbita desordenada
// queda igual cada vez que se abre la página.
function azar(texto, sal) {
    let h = 2166136261 ^ sal;
    for (let i = 0; i < texto.length; i++) {
        h ^= texto.charCodeAt(i);
        h = Math.imul(h, 16777619);
    }
    return ((h >>> 0) % 10000) / 10000;
}

/* Reparte las fichas en anillo alrededor del centro blanco. Todo en %
   del nodo, por eso no hay que recalcular nada al ampliar. Las fichas
   que ya estaban se reutilizan: así se deslizan a su nuevo lugar en vez
   de aparecer de golpe. */
function dibujarOrbitas() {
    CATEGORIAS.forEach(function (c) {
        const nodo = nodos[c.clave];
        const obras = obrasDelNodo(c.clave);
        const n = obras.length;
        const vigentes = new Set();

        nodo.cuenta.textContent = n === 0 ? "vacío" : n + (n === 1 ? " trabajo" : " trabajos");

        // Lado mayor de cada ficha: grande con pocas, más chica con muchas.
        const lado = Math.max(7, Math.min(21, 340 / Math.max(n, 1)));
        const radio = 43;

        obras.forEach(function (o, i) {
            vigentes.add(o.id);
            let ficha = nodo.fichas.get(o.id);
            const nueva = !ficha;

            if (nueva) {
                ficha = crearFicha(o, c.clave);
                ficha.classList.add("naciendo");
                ficha.style.left = "50%";
                ficha.style.top = "50%";
                nodo.capa.appendChild(ficha);
                nodo.fichas.set(o.id, ficha);
            }

            const paso = (Math.PI * 2) / n;
            const angulo = -Math.PI / 2 + (i + (azar(o.id, 1) - 0.5) * 0.35) * paso;
            const r = radio + (azar(o.id, 2) - 0.5) * 5;

            ficha.dataset.lado = lado * (0.85 + azar(o.id, 3) * 0.3);
            ficha.style.zIndex = String(i + 1);
            aplicarTamaño(ficha, o);

            const colocar = function () {
                ficha.style.left = (50 + Math.cos(angulo) * r) + "%";
                ficha.style.top = (50 + Math.sin(angulo) * r) + "%";
                ficha.classList.remove("naciendo");
            };

            // Una ficha nueva parte del centro: se espera un cuadro para que
            // el navegador registre ese punto de partida.
            if (nueva) requestAnimationFrame(function () { requestAnimationFrame(colocar); });
            else colocar();
        });

        nodo.fichas.forEach(function (ficha, id) {
            if (vigentes.has(id)) return;
            nodo.fichas.delete(id);
            ficha.remove();
        });
    });
}

// Horizontal o vertical según la imagen. Mientras no carga, 4:3.
function aplicarTamaño(ficha, o) {
    const lado = Number(ficha.dataset.lado);
    const proporcion = o.tipo === "texto" ? 0.78 : (o.proporcion || 4 / 3);

    const ancho = proporcion >= 1 ? lado : lado * proporcion;
    const alto = proporcion >= 1 ? lado / proporcion : lado;
    ficha.style.width = ancho + "%";
    ficha.style.height = alto + "%";
}

function redimensionarFichas(o) {
    CATEGORIAS.forEach(function (c) {
        const ficha = nodos[c.clave] && nodos[c.clave].fichas.get(o.id);
        if (ficha) aplicarTamaño(ficha, o);
    });
}

function crearFicha(o, clave) {
    const ficha = crearTocable("ficha");
    ficha.dataset.obra = o.id;
    ficha.setAttribute("aria-label", nombreDe(o));

    contenidoDe(o, 600).forEach(function (parte) { ficha.appendChild(parte); });

    hacerArrastrable(ficha, o, clave);
    ficha.addEventListener("click", function (evento) {
        evento.stopPropagation();
        const obras = obrasDelNodo(clave);
        abrirVisor(obras, obras.indexOf(o));
    });
    return ficha;
}

/* =========================================================
   8. Arrastrar
   De la lista a un nodo: el trabajo entra al nodo.
   De un nodo a otro: se mueve.
   De un nodo a cualquier otro lado: sale del nodo.
   ========================================================= */
function hacerArrastrable(elemento, o, desde) {
    elemento.draggable = true;

    elemento.addEventListener("dragstart", function (evento) {
        estado.arrastre = { id: o.id, desde: desde, recibido: false };
        evento.dataTransfer.effectAllowed = "move";
        // Firefox no arrastra si no hay datos.
        evento.dataTransfer.setData("text/plain", o.id);
        elemento.classList.add("arrastrando");
    });

    elemento.addEventListener("dragend", function () {
        elemento.classList.remove("arrastrando");
        estado.arrastre = null;
        document.querySelectorAll(".nodo.sobre").forEach(function (n) { n.classList.remove("sobre"); });
    });
}

function recibirArrastre(raiz, clave) {
    let dentro = 0;   // dragenter/leave se disparan también al pasar por los hijos

    raiz.addEventListener("dragenter", function (evento) {
        if (!estado.arrastre) return;
        evento.preventDefault();
        dentro++;
        raiz.classList.add("sobre");
    });

    raiz.addEventListener("dragover", function (evento) {
        if (!estado.arrastre) return;
        evento.preventDefault();
        evento.dataTransfer.dropEffect = "move";
    });

    raiz.addEventListener("dragleave", function () {
        dentro = Math.max(0, dentro - 1);
        if (dentro === 0) raiz.classList.remove("sobre");
    });

    raiz.addEventListener("drop", function (evento) {
        evento.preventDefault();
        evento.stopPropagation();
        dentro = 0;
        raiz.classList.remove("sobre");

        const arrastre = estado.arrastre;
        if (!arrastre) return;
        arrastre.recibido = true;

        const o = obra(arrastre.id);
        if (arrastre.desde === clave) return;   // soltada en su mismo nodo
        if (arrastre.desde) o.categorias.splice(o.categorias.indexOf(arrastre.desde), 1);
        if (o.categorias.indexOf(clave) === -1) o.categorias.push(clave);
        alCambiar();
    });
}

// Soltar fuera de los nodos: si venía de uno, sale de él.
document.addEventListener("dragover", function (evento) {
    if (estado.arrastre && estado.arrastre.desde) evento.preventDefault();
});

document.addEventListener("drop", function (evento) {
    const arrastre = estado.arrastre;
    if (!arrastre || arrastre.recibido || !arrastre.desde) return;
    evento.preventDefault();
    quitar(obra(arrastre.id), arrastre.desde);
});

/* =========================================================
   9. Visor
   ========================================================= */
const visor = document.getElementById("visor");
let foco = null;   // a dónde vuelve el foco al cerrar

function abrirVisor(obras, i) {
    if (!estado.visor) foco = document.activeElement;
    // Copia: si la clasificación cambia con el visor abierto, las flechas
    // siguen recorriendo la lista con la que se abrió.
    estado.visor = { lista: obras.slice(), i: i };
    pintarVisor();
    visor.classList.add("abierto");
    document.getElementById("cerrar").focus();
}

function cerrarVisor() {
    estado.visor = null;
    visor.classList.remove("abierto");
    document.getElementById("visor-medio").innerHTML = "";   // corta el video
    if (foco && document.body.contains(foco)) foco.focus();
}

function moverVisor(paso) {
    const v = estado.visor;
    if (!v || v.lista.length < 2) return;
    v.i = (v.i + paso + v.lista.length) % v.lista.length;
    pintarVisor();
}

function pintarVisor() {
    const v = estado.visor;
    const o = v.lista[v.i];
    const medio = document.getElementById("visor-medio");
    medio.innerHTML = "";

    if (o.tipo === "texto") {
        const texto = document.createElement("div");
        texto.className = "visor-texto";
        texto.textContent = o.contenido;
        medio.appendChild(texto);

    } else if ((o.tipo === "youtube" && o.idVideo) || (o.tipo === "video" && o.id)) {
        const marco = document.createElement("iframe");
        marco.src = urlReproductor(o);
        marco.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
        marco.allowFullscreen = true;
        marco.title = nombreDe(o);
        medio.appendChild(marco);

    } else {
        const imagen = crearImagen(o, 1600);
        if (imagen) {
            imagen.loading = "eager";
            medio.appendChild(imagen);
        } else {
            const hueco = document.createElement("div");
            hueco.className = "visor-hueco";
            hueco.textContent = "Sin vista previa";
            medio.appendChild(hueco);
        }
    }

    document.getElementById("visor-curso").textContent = o.curso || "Sin curso";
    document.getElementById("visor-linea").textContent = [o.linea, o.semestre].filter(Boolean).join(" · ");
    document.getElementById("visor-archivo").textContent = o.archivo || "";
    document.getElementById("visor-indice").textContent = (v.i + 1) + " de " + v.lista.length;

    const variasObras = v.lista.length > 1;
    document.getElementById("previa").hidden = !variasObras;
    document.getElementById("siguiente").hidden = !variasObras;

    pintarAlternar();
}

// Un botón por nodo: prende y apaga el trabajo en ese nodo.
function pintarAlternar() {
    const o = estado.visor.lista[estado.visor.i];
    const caja = document.getElementById("visor-alternar");
    caja.innerHTML = "";

    CATEGORIAS.forEach(function (c) {
        const boton = document.createElement("button");
        boton.type = "button";
        boton.className = "alternar";
        boton.textContent = c.titulo;
        const esta = o.categorias.indexOf(c.clave) !== -1;
        boton.setAttribute("aria-pressed", String(esta));
        boton.addEventListener("click", function () {
            if (o.categorias.indexOf(c.clave) !== -1) quitar(o, c.clave);
            else poner(o, c.clave);
            caja.querySelectorAll(".alternar")[CATEGORIAS.indexOf(c)].focus();
        });
        caja.appendChild(boton);
    });
}

document.getElementById("cerrar").addEventListener("click", cerrarVisor);
document.getElementById("previa").addEventListener("click", function () { moverVisor(-1); });
document.getElementById("siguiente").addEventListener("click", function () { moverVisor(1); });

// Tocar el fondo del visor lo cierra.
visor.addEventListener("click", function (evento) {
    if (evento.target === visor || evento.target.classList.contains("visor-medio")) cerrarVisor();
});

/* =========================================================
   10. Teclado, pista y arranque
   ========================================================= */
document.addEventListener("keydown", function (evento) {
    if (estado.visor) {
        if (evento.key === "Escape") cerrarVisor();
        else if (evento.key === "ArrowLeft") moverVisor(-1);
        else if (evento.key === "ArrowRight") moverVisor(1);
        return;
    }
    if (evento.key !== "Escape") return;
    if (estado.ampliado) ampliar(null);
    else if (estado.listaAbierta) alternarLista(false);
});

function actualizarPista() {
    const pista = document.getElementById("pista");
    const hayClasificados = OBRAS.some(function (o) { return o.categorias.length > 0; });

    if (OBRAS.length === 0) pista.textContent = "";
    else if (!estado.listaAbierta && !hayClasificados) pista.textContent = "Abre la lista ☰ y arrastra tus trabajos hacia un nodo.";
    else if (estado.listaAbierta) pista.textContent = "Arrastra un trabajo a un nodo. Para sacarlo, arrástralo fuera del círculo.";
    else pista.textContent = "Toca un nodo para verlo de cerca.";
}

function mostrarAviso(titulo, texto) {
    document.getElementById("aviso-titulo").textContent = titulo;
    document.getElementById("aviso-texto").textContent = texto;
    document.getElementById("aviso").hidden = false;
}

function arrancar() {
    if (ARCHIVO.error) {
        mostrarAviso("No se pudo abrir el archivo", ARCHIVO.error);
        return;
    }

    if (ARCHIVO.nombre) document.getElementById("estudiante").textContent = ARCHIVO.nombre;
    if (ARCHIVO.urlCarpeta) {
        const enlace = document.getElementById("drive");
        enlace.href = ARCHIVO.urlCarpeta;
        enlace.hidden = false;
    }
    document.getElementById("demo").hidden = EN_APPS_SCRIPT;

    crearLista();
    crearNodos();
    disponerNodos();
    dibujarOrbitas();
    actualizarMarcas();
    actualizarPista();

    document.getElementById("menu").addEventListener("click", function () { alternarLista(); });
    document.getElementById("volver").addEventListener("click", function () { ampliar(null); });

    let espera = null;
    window.addEventListener("resize", function () {
        clearTimeout(espera);
        espera = setTimeout(disponerNodos, 80);
    });

    // Sin nada clasificado todavía, la lista parte abierta: es lo primero
    // que hay que usar.
    if (OBRAS.length > 0 && !OBRAS.some(function (o) { return o.categorias.length > 0; })) {
        alternarLista(true);
    }
}

/* Datos de ejemplo para abrir el archivo suelto y revisar el diseño sin
   pasar por Apps Script. Los trabajos no tienen id de Drive, así que se
   ven como rectángulos grises; los textos sí se leen. */
function datosDeEjemplo() {
    const cursos = [
        ["Talleres", "Taller de operaciones y procedimientos visuales", 9],
        ["Estudios visuales", "Introducción al arte contemporáneo", 5],
        ["Lenguajes artísticos", "Técnicas escultóricas", 7],
        ["Imagen y tecnología", "Medios digitales", 6]
    ];
    const proporciones = [4 / 3, 3 / 4, 1, 16 / 9, 2 / 3, 5 / 4];
    const obras = [];
    const clasificacion = {};

    cursos.forEach(function (curso, c) {
        for (let i = 0; i < curso[2]; i++) {
            const id = "ejemplo-" + c + "-" + i;
            const esTexto = i % 4 === 3;
            obras.push({
                id: id, linea: curso[0], curso: curso[1],
                archivo: (esTexto ? "texto" : "imagen") + "-ART0000" + c + "-ejemplo-" + (i + 1) +
                    (esTexto ? ".txt" : ".webp"),
                tipo: esTexto ? "texto" : "imagen", ejemplo: true,
                proporcion: proporciones[(c + i) % proporciones.length],
                contenido: esTexto ? "Notas de proceso sobre el trabajo. El material se comportó distinto " +
                    "de lo esperado y eso terminó siendo el centro de la obra." : ""
            });
            if (i % 3 === 0) clasificacion[id] = ["forma"];
            if (i % 5 === 1) clasificacion[id] = ["nudo", "modos"];
        }
    });

    return {
        error: "", nombre: "Estudiante de ejemplo", urlCarpeta: "",
        categorias: [
            { clave: "forma", titulo: "Forma y materiales", definicion: "" },
            { clave: "nudo", titulo: "Nudo conceptual", definicion: "" },
            { clave: "modos", titulo: "Modos de hacer", definicion: "" }
        ],
        lineas: [], obras: obras, clasificacion: clasificacion
    };
}

arrancar();
