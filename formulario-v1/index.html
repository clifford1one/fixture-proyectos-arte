<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archivo de prácticas — Subida de trabajos</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>


  <div class="contenedor">

    <header class="encabezado">
      <h1>Archivo de prácticas</h1>
      <p>Sube imágenes y textos de tus trabajos indicando el curso al que pertenecen. Puedes volver las veces que
        quieras durante el mes de subida.</p>
    </header>

    <form id="formulario" novalidate>

      <!-- Nombre del estudiante -->
      <div class="campo">
        <label for="nombre">Nombre del estudiante</label>
        <input type="text" id="nombre" name="nombre" autocomplete="name" placeholder="Nombre y apellido">
        <p class="ayuda" id="ayuda-nombre" hidden></p>
      </div>

      <!-- Un bloque por curso. Se agregan y quitan desde el script. -->
      <div id="bloques"></div>

      <button type="button" class="agregar-bloque" id="agregar-bloque">
        + Añadir más trabajos de otro curso
      </button>

      <!-- Envío -->
      <div class="pie">
        <button type="submit" class="enviar" id="enviar" disabled>Enviar trabajos</button>

        <div class="barra" id="barra" hidden>
          <div class="barra-avance" id="barra-avance"></div>
        </div>

        <p class="aviso-envio" id="aviso-envio" aria-live="polite"></p>
      </div>

    </form>

    <!-- Molde de cada bloque de curso -->
    <template id="plantilla-bloque">
      <fieldset class="bloque">
        <legend class="bloque-titulo">Curso sin elegir</legend>

        <button type="button" class="bloque-quitar" title="Quitar este curso"
          aria-label="Quitar este curso">×</button>

        <div class="campo">
          <label class="etiqueta-curso">Curso</label>
          <select class="curso">
            <option value="">Elige un curso</option>
          </select>

          <p class="aviso-curso" hidden>
            Debes elegir el curso para subir este material.
          </p>
        </div>

        <div class="campo">
          <span class="rotulo">Imágenes</span>

          <label class="boton-archivo">
            Elegir imágenes
            <input type="file" class="imagenes" accept="image/png,image/jpeg" multiple
              aria-label="Imágenes de este curso">
          </label>

          <p class="ayuda">Formatos PNG, JPG o JPEG. Máximo 10&nbsp;MB por imagen.</p>

          <div class="grilla"></div>
        </div>

        <div class="campo">
          <span class="rotulo">Textos</span>

          <p class="ayuda">Una frase o un extracto. Puedes dejar el campo vacío
            si solo subes imágenes.</p>

          <!-- Los textos se agregan y quitan desde el script. -->
          <div class="textos"></div>

          <button type="button" class="agregar-texto">+ Añadir un texto</button>
        </div>

        <p class="resumen" aria-live="polite"></p>
      </fieldset>
    </template>

    <!-- Pantalla final: reemplaza al formulario cuando termina la subida -->
    <section class="gracias" id="pantalla-gracias" hidden>
      <h2>Gracias por cargar tus trabajos</h2>
      <p class="gracias-detalle" id="gracias-detalle"></p>
      <a class="gracias-enlace" id="gracias-enlace" href="#" target="_blank" rel="noopener" hidden>
        Ver mi carpeta en Drive
      </a>
      <p class="gracias-nota" id="gracias-nota"></p>
      <button type="button" class="gracias-boton" id="subir-mas">Subir más trabajos</button>
    </section>

  </div>
</body>

</html>
